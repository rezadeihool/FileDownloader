    /* Item from /upload — uses server's download_uri verbatim */
    function fromUpload(res, localFile){
        const fileName = res.filename;
        return {
            id: fileName,
            name: fileName,
            url: '',
            size: localFile ? localFile.size : 0,
            downloaded: localFile ? localFile.size : 0,
            status: 'FINISHED',
            at: Date.now(),
            startedAt: Date.now(),
            finishedAt: Date.now(),
            /* Use the server-provided download_uri verbatim */
            directUri: res.download_uri || ('/forceStream/' + encodeURIComponent(fileName)),
            source: 'upload',
            error: null
        };
    }

    function mergeApi(it, d){
        if (d.file_dl_status) it.status = d.file_dl_status;
        if (d.file_current_dl_size != null) it.downloaded = Number(d.file_current_dl_size) || 0;
        if (d.file_size != null) it.size = Number(d.file_size);
        if (d.file_name) it.name = d.file_name;
        if (d.file_url) it.url = d.file_url;
    }

    /* ============================================================
       Helpers
       ============================================================ */
    function fmtBytes(n){
        n = Number(n);
        if (!isFinite(n) || n <= 0) return '';
        const u = ['B','KB','MB','GB','TB']; let i = 0;
        while (n >= 1024 && i < u.length - 1){ n /= 1024; i++; }
        return n.toFixed(i && n < 10 ? 1 : 0) + ' ' + u[i];
    }
    function fmtSpeed(bps){
        if (!isFinite(bps) || bps <= 0) return '';
        const mb = bps / (1024 * 1024);
        if (mb >= 1) return mb.toFixed(2) + ' MB/s';
        const kb = bps / 1024;
        if (kb >= 1) return kb.toFixed(0) + ' KB/s';
        return bps.toFixed(0) + ' B/s';
    }
    function fmtDuration(sec){
        sec = Math.max(0, Math.round(sec));
        if (sec < 60) return sec + 's';
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        if (m < 60) return m + 'm ' + s + 's';
        const h = Math.floor(m / 60);
        const mm = m % 60;
        return h + 'h ' + mm + 'm';
    }
    function fmtElapsed(ms){
        const sec = Math.max(0, Math.round(ms / 1000));
        if (sec < 60) return sec + 's';
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        if (m < 60) return m + 'm ' + s + 's';
        const h = Math.floor(m / 60);
        const mm = m % 60;
        return h + 'h ' + mm + 'm';
    }
    const up = s => String(s ?? '').toUpperCase();
    const isDone = s => ['FINISHED','DONE','COMPLETED','SUCCESS'].includes(up(s));
    const isFail = s => ['FAILED','ERROR','CANCELED','CANCELLED'].includes(up(s));

    function statusKey(s){
        if (isDone(s)) return 'ready';
        if (isFail(s)) return 'failed';
        if (!s) return 'queued';
        if (up(s) === 'DOWNLOADING') return 'downloading';
        return null;
    }
    function label(s){
        const k = statusKey(s);
        return k ? t(k) : (up(s)[0] + up(s).slice(1).toLowerCase());
    }
    function nameFromUrl(u){
        try { return decodeURIComponent(new URL(u).pathname.split('/').pop() || 'file'); }
        catch { return 'file'; }
    }
    function fileIcon(name, url){
        const ext = (name || url || '').split('.').pop().toLowerCase();
        if (['mp4','mkv','webm','mov','avi','m4v'].includes(ext)) return ICON.video;
        if (['png','jpg','jpeg','gif','webp','svg','bmp'].includes(ext)) return ICON.image;
        if (['zip','tar','gz','rar','7z','bz2'].includes(ext)) return ICON.zip;
        return ICON.file;
    }

    /* ============================================================
       Speed sampling
       ============================================================ */
    const SAMPLE_WINDOW_MS = 30_000;
    const SAMPLE_MIN_GAP_MS = 800;
    function pushSample(n, bytes){
        if (!n.samples) n.samples = [];
        const now = performance.now();
        const last = n.samples[n.samples.length - 1];
        if (last){
            const dt = now - last.t;
            if (last.bytes === bytes && dt < 3000) return;
            if (dt < SAMPLE_MIN_GAP_MS) return;
        }
        n.samples.push({ t: now, bytes });
        const cutoff = now - SAMPLE_WINDOW_MS;
        while (n.samples.length > 2 && n.samples[0].t < cutoff) n.samples.shift();
        if (n.samples.length > 40) n.samples.shift();
    }
    function computeSpeed(n){
        if (!n.samples || n.samples.length < 2) return 0;
        const first = n.samples[0];
        const last = n.samples[n.samples.length - 1];
        const dt = (last.t - first.t) / 1000;
        if (dt <= 0.5) return 0;
        const dB = last.bytes - first.bytes;
        if (dB <= 0) return 0;
        return dB / dt;
    }

    /* ============================================================
       Render
       ============================================================ */
    const nodes = new Map();

    function updateCount(){
        setText(countEl, String(items.length));
    }

    function render(){
        updateCount();
        if (!items.length){
            listEl.innerHTML = `
      <div class="empty">
        <div class="empty-art">${ICON.tray}</div>
        <div class="empty-title">${t('empty')}</div>
        <div class="empty-hint">${t('emptyHint')}</div>
      </div>`;
            nodes.clear();
            return;
        }
        listEl.querySelector('.empty')?.remove();
        const seen = new Set();
        let i = 0;
        for (const it of items){
            seen.add(it.id);
            let n = nodes.get(it.id);
            if (!n){ n = mount(it, i); nodes.set(it.id, n); }
            update(n, it);
            i++;
        }
        for (const [id, n] of nodes) if (!seen.has(id)){ n.el.remove(); nodes.delete(id); }
        items.forEach(it => listEl.appendChild(nodes.get(it.id).el));
    }

    function mount(it, index){
        const el = document.createElement('article');
        el.className = 'card';
        el.dataset.id = it.id;
        el.style.setProperty('--i', index);
        el.innerHTML = `
    <div class="card-top">
      <div class="meta">
        <span class="file-icon">
          ${fileIcon(it.name, it.url)}
          <i class="status-dot"></i>
        </span>
        <div style="min-width:0;flex:1">
          <div class="name"></div>
          <div class="sub">
            <span class="sub-text"></span>
            <span class="note source" hidden></span>
          </div>
        </div>
      </div>
      <span class="badge"></span>
    </div>
    <div class="bar"><i></i></div>
    <div class="stats"></div>
    <div class="card-error" hidden></div>
    <div class="actions"></div>
    <video class="player" controls preload="metadata" playsinline hidden></video>`;
        const n = {
            el,
            name: el.querySelector('.name'),
            subText: el.querySelector('.sub-text'),
            sourceNote: el.querySelector('.note.source'),
            badge: el.querySelector('.badge'),
            fill: el.querySelector('.bar i'),
            stats: el.querySelector('.stats'),
            errorEl: el.querySelector('.card-error'),
            actions: el.querySelector('.actions'),
            video: el.querySelector('.player'),
            lastStatus: it.status,
            videoLoaded: false,
            actionsSig: null,
            statsSig: null,
            samples: [],
            statsEls: null
        };
        return n;
    }

    function update(n, it){
        const done = isDone(it.status), fail = isFail(it.status);
        const wasActive = !isDone(n.lastStatus) && !isFail(n.lastStatus);
        const busy = !done && !fail;

        if (wasActive && done){
            if (!it.finishedAt) it.finishedAt = Date.now();
            if (!n.el.classList.contains('just-done')){
                n.el.classList.add('just-done');
                setTimeout(() => n.el.classList.remove('just-done'), 1200);
            }
            toast(t('ready') + ' · ' + (it.name || ''), 'ok');
            n.samples = [];
        }
        if (!it.finishedAt && (done || fail)) it.finishedAt = Date.now();
        n.lastStatus = it.status;

        const sizeRaw = Number(it.size);
        const sizeKnown = isFinite(sizeRaw) && sizeRaw > 0;
        const downloaded = Math.max(0, Number(it.downloaded) || 0);
        const pct = sizeKnown && downloaded > 0
            ? Math.min(100, Math.floor(downloaded / sizeRaw * 100)) : 0;

        if (busy && downloaded > 0) pushSample(n, downloaded);

        setText(n.name, it.name || 'file');
        setAttr(n.name, 'title', it.url || it.id);

        const parts = [it.id];
        if (sizeKnown){
            parts.push(busy
                ? `${fmtBytes(downloaded) || '0 B'} / ${fmtBytes(sizeRaw)}`
                : fmtBytes(sizeRaw));
        } else if (downloaded > 0){
            parts.push(fmtBytes(downloaded));
        }
        if (busy && sizeKnown && downloaded > 0) parts.push(pct + '%');
        setText(n.subText, parts.filter(Boolean).join('  ·  '));

        if (it.source === 'upload'){
            setHidden(n.sourceNote, false);
            const html = ICON.up + '<span>' + t('srcUpload') + '</span>';
            if (n.sourceNote.dataset.sig !== html){
                n.sourceNote.dataset.sig = html;
                n.sourceNote.innerHTML = html;
            }
        } else {
            setHidden(n.sourceNote, true);
            if (n.sourceNote.textContent) n.sourceNote.textContent = '';
        }

        updateStats(n, it, { busy, done, fail, sizeKnown, sizeRaw, downloaded });

        const hasError = !!(it.error && busy);
        setHidden(n.errorEl, !hasError);
        if (hasError){
            const sig = it.error;
            if (n.errorEl.dataset.sig !== sig){
                n.errorEl.dataset.sig = sig;
                n.errorEl.innerHTML = ICON.alert;
                const span = document.createElement('span');
                span.textContent = sig;
                n.errorEl.appendChild(span);
            }
        } else if (n.errorEl.dataset.sig){
            n.errorEl.dataset.sig = '';
            n.errorEl.textContent = '';
        }

        const badgeClass = 'badge ' + (done ? 'ok' : fail ? 'err' : 'busy');
        const badgeHtml = (done ? ICON.check : fail ? ICON.alert : '') +
            '<span>' + label(it.status) + '</span>';
        if (n.badge.dataset.sig !== badgeHtml){
            n.badge.dataset.sig = badgeHtml;
            n.badge.innerHTML = badgeHtml;
        }
        setClass(n.badge, badgeClass);

        const unknownSize = busy && !sizeKnown;
        if (n.el.classList.contains('is-unknown-size') !== unknownSize){
            n.el.classList.toggle('is-unknown-size', unknownSize);
        }
        let width = '';
        if (done) width = '100%';
        else if (sizeKnown) width = (downloaded > 0 ? pct : 0) + '%';
        setWidth(n.fill, width);

        const sig = lang;
        if (n.actionsSig !== sig){
            n.actionsSig = sig;
            n.actions.innerHTML =
                `<button class="btn" data-act="play" type="button">${ICON.play}<span>${t('play')}</span></button>` +
                `<a class="btn is-disabled" data-act="save" href="#">${ICON.save}<span>${t('save')}</span></a>` +
                `<button class="btn ghost" data-act="copy" type="button">${ICON.copy}<span>${t('copy')}</span></button>` +
                `<button class="btn ghost" data-act="del" type="button">${ICON.trash}<span>${t('remove')}</span></button>`;
            n.playBtn = n.actions.querySelector('[data-act="play"]');
            n.saveBtn = n.actions.querySelector('[data-act="save"]');
        }
        if (n.playBtn){
            if (n.playBtn.disabled !== !done) n.playBtn.disabled = !done;
            setAttr(n.playBtn, 'title', !done ? t('working') : '');
        }
        if (n.saveBtn){
            const wantDisabled = !done;
            if (n.saveBtn.classList.contains('is-disabled') !== wantDisabled){
                n.saveBtn.classList.toggle('is-disabled', wantDisabled);
            }
            setAttr(n.saveBtn, 'aria-disabled', String(wantDisabled));
            const href = done
                ? (it.directUri || `/downloads/${encodeURIComponent(it.id)}`)
                : '#';
            if (n.saveBtn.getAttribute('href') !== href) n.saveBtn.setAttribute('href', href);
            if (done && it.directUri){
                if (n.saveBtn.getAttribute('download') !== it.name)
                    n.saveBtn.setAttribute('download', it.name);
            } else {
                n.saveBtn.removeAttribute('download');
            }
            setAttr(n.saveBtn, 'title', !done ? t('working') : '');
        }

        if (done && !n.videoLoaded){
            const src = it.directUri || ('/stream/' + encodeURIComponent(it.id));
            n.video.src = src;
            n.videoLoaded = true;
        }
    }

    function updateStats(n, it, { busy, done, fail, sizeKnown, sizeRaw, downloaded }){
        const stats = [];
        if (busy){
            const speed = computeSpeed(n);
            if (speed > 0) stats.push({ key:'speed', icon:ICON.down, text: fmtSpeed(speed) });
            if (sizeKnown && speed > 0){
                const etaSec = (sizeRaw - downloaded) / speed;
                if (etaSec > 0 && etaSec < 86400 * 3){
                    stats.push({ key:'eta', icon:ICON.hour, text: '~' + fmtDuration(etaSec) + ' ' + t('etaLeft') });
                }
            } else if (sizeKnown && downloaded > 0 && !speed){
                stats.push({ key:'eta', icon:ICON.hour, text: t('etaCalc'), muted: true });
            }
            stats.push({
                key:'elapsed', icon:ICON.clock,
                text: fmtElapsed(Date.now() - (it.startedAt || Date.now())) + ' ' + t('elapsed'),
                live:true
            });
        } else if (done || fail){
            if (it.startedAt && it.finishedAt){
                stats.push({
                    key:'elapsed', icon:ICON.clock,
                    text: fmtElapsed(it.finishedAt - it.startedAt) + ' ' + t('elapsed'),
                    live:false
                });
            }
            if (fail && it.error) stats.push({ key:'error', text: it.error, muted:true });
        }

        const sig = stats.map(s => s.key + '|' + (s.muted?'m':'') + '|' + (s.live?'l':'')).join(',');
        if (n.statsSig !== sig){
            n.statsSig = sig;
            n.stats.innerHTML = '';
            n.statsEls = {};
            stats.forEach((s, i) => {
                if (i > 0){
                    const sep = document.createElement('span');
                    sep.className = 'sep';
                    sep.textContent = '·';
                    n.stats.appendChild(sep);
                }
                const span = document.createElement('span');
                span.className = 'stat' + (s.muted ? ' muted' : '');
                if (s.icon) span.innerHTML = s.icon;
                const val = document.createElement('span');
                val.className = 'val';
                val.textContent = s.text;
                span.appendChild(val);
                n.stats.appendChild(span);
                n.statsEls[s.key] = val;
            });
        } else {
            for (const s of stats){
                const el = n.statsEls?.[s.key];
                if (el && el.textContent !== s.text) el.textContent = s.text;
            }
        }
    }

    setInterval(() => {
        const now = Date.now();
        for (const it of items){
            if (isDone(it.status) || isFail(it.status)) continue;
            const n = nodes.get(it.id);
            if (!n || !n.statsEls?.elapsed) continue;
            const txt = fmtElapsed(now - (it.startedAt || now)) + ' ' + t('elapsed');
            const el = n.statsEls.elapsed;
            if (el.textContent !== txt) el.textContent = txt;
        }
    }, 1000);

    /* ============================================================
       Actions
       ============================================================ */
    listEl.addEventListener('click', async e => {
        const saveEl = e.target.closest('[data-act="save"]');
        if (saveEl && saveEl.classList.contains('is-disabled')){ e.preventDefault(); return; }

        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const card = btn.closest('.card');
        if (!card) return;
        const id = card.dataset.id;
        const act = btn.dataset.act;
        if (act === 'save') return;

        if (act === 'play'){
            if (btn.disabled) return;
            const v = card.querySelector('video');
            v.hidden = !v.hidden;
            if (!v.hidden) v.play().catch(() => {});
        } else if (act === 'copy'){
            const it = items.find(x => x.id === id);
            /* Use server-provided download_uri verbatim for uploads */
            const link = it?.directUri
                ? location.origin + it.directUri
                : `${location.origin}/downloads/${encodeURIComponent(id)}`;
            const ok = await copyText(link);
            if (ok){
                const span = btn.querySelector('span');
                const old = span.textContent;
                span.textContent = t('copied');
                toast(t('toastCopied') + ' · ' + link, 'ok', 3200);
                setTimeout(() => span.textContent = old, 1400);
            } else {
                toast(t('errCopy') + ' — ' + link, 'err', 4200);
            }
        } else if (act === 'del'){
            items = items.filter(x => x.id !== id);
            save(); render();
            toast(t('toastRemoved'));
        }
    });

    /* ============================================================
       Mode tabs
       ============================================================ */
    document.querySelectorAll('.mode-tabs button').forEach(btn => {
        btn.addEventListener('click', () => {
            const mode = btn.dataset.mode;
            document.querySelectorAll('.mode-tabs button').forEach(b => {
                const on = b === btn;
                b.classList.toggle('active', on);
                b.setAttribute('aria-selected', String(on));
            });
            document.querySelectorAll('.mode-panel').forEach(p => {
                p.hidden = p.dataset.mode !== mode;
            });
            hintEl.textContent = '';
            uploadHint.textContent = '';
        });
    });

    /* ============================================================
       URL start
       ============================================================ */
    function shakeInput(){
        urlEl.classList.remove('error');
        void urlEl.offsetWidth;
        urlEl.classList.add('error');
        setTimeout(() => urlEl.classList.remove('error'), 700);
    }
    function failStart(msg, { shake = false } = {}){
        hintEl.innerHTML = ICON.alert;
        const span = document.createElement('span');
        span.textContent = msg;
        hintEl.appendChild(span);
        toast(msg, 'err', 4200);
        if (shake) shakeInput();
    }
    function resetStartBtn(oldLabel){
        goEl.disabled = false;
        goEl.classList.remove('loading');
        const span = goEl.querySelector('span');
        if (span) span.textContent = oldLabel; else goEl.textContent = oldLabel;
    }

    async function start(){
        const url = urlEl.value.trim();
        if (!url){ failStart(t('errNoUrl'), { shake: true }); urlEl.focus(); return; }
        if (!/^https?:\/\//i.test(url)){ failStart(t('errInvalidUrl'), { shake: true }); urlEl.focus(); return; }

        goEl.disabled = true;
        goEl.classList.add('loading');
        const span = goEl.querySelector('span');
        const oldLabel = span ? span.textContent : goEl.textContent;
        if (span) span.textContent = t('starting'); else goEl.textContent = t('starting');
        hintEl.textContent = '';

        let res;
        try { res = await fetchWithTimeout('/dl/' + encodeURIComponent(url), 20000); }
        catch (err){
            const msg = err?.name === 'AbortError'
                ? t('errTimeout')
                : t('errNetwork') + (err?.message ? ' (' + err.message + ')' : '');
            failStart(msg); resetStartBtn(oldLabel); return;
        }
        if (!res.ok){ failStart(`${t('errHttp')}: HTTP ${res.status} ${res.statusText || ''}`.trim()); resetStartBtn(oldLabel); return; }

        let text;
        try { text = await res.text(); }
        catch (err){ failStart(`${t('errEmpty')} (${err?.message || 'read failed'})`); resetStartBtn(oldLabel); return; }
        if (!text || !text.trim()){ failStart(t('errEmpty')); resetStartBtn(oldLabel); return; }

        let parsed;
        try { parsed = JSON.parse(text); }
        catch { failStart(`${t('errBadJson')} — ${text.slice(0, 100)}`); resetStartBtn(oldLabel); return; }

        if (parsed && typeof parsed === 'object' && 'status' in parsed && parsed.status === false){
            const extra = parsed.msg ? ': ' + parsed.msg : '';
            failStart(t('errRejected') + extra); resetStartBtn(oldLabel); return;
        }
        const d = parsed?.data ?? parsed;
        if (!d || typeof d !== 'object'){ failStart(t('errNoData')); resetStartBtn(oldLabel); return; }
        if (!d.file_id){ failStart(t('errNoId')); resetStartBtn(oldLabel); return; }

        items.unshift(fromApi(d, url));
        save(); render();
        urlEl.value = '';
        toast(t('toastStarted'), 'ok');
        resetStartBtn(oldLabel);
    }
    goEl.addEventListener('click', start);
    urlEl.addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
    urlEl.addEventListener('input', () => { hintEl.textContent = ''; });

    /* ============================================================
       Upload
       ============================================================ */
    function setUploadProgress(name, loaded, total){
        setHidden(uploadProgress, false);
        const nameHtml = ICON.up + '<span>' + escapeHtml(name) + '</span>';
        if (upName.dataset.sig !== nameHtml){
            upName.dataset.sig = nameHtml;
            upName.innerHTML = nameHtml;
        }
        setText(upBytes, fmtBytes(loaded) || '0 B');
        const pct = total > 0 ? Math.min(100, Math.round(loaded / total * 100)) : 0;
        setText(upPct, pct + '%');
        setWidth(upBar, pct + '%');
    }
    function escapeHtml(s){
        return String(s ?? '').replace(/[&<>"']/g, c => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
    }
    function resetUploadProgress(){
        setHidden(uploadProgress, true);
        setWidth(upBar, '0%');
        setText(upPct, '0%');
        setText(upBytes, '0 B');
        upName.innerHTML = '';
        upName.dataset.sig = '';
    }
    function failUpload(msg){
        uploadHint.innerHTML = ICON.alert;
        const span = document.createElement('span');
        span.textContent = msg;
        uploadHint.appendChild(span);
        toast(msg, 'err', 4200);
    }

    function uploadFile(file){
        return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload', true);
            xhr.upload.onprogress = e => {
                if (e.lengthComputable) setUploadProgress(file.name, e.loaded, e.total);
            };
            xhr.upload.onloadstart = () => setUploadProgress(file.name, 0, file.size);
            xhr.onload = () => {
                if (xhr.status < 200 || xhr.status >= 300){
                    reject(new Error(`${t('errUploadHttp')}: HTTP ${xhr.status} ${xhr.statusText || ''}`.trim()));
                    return;
                }
                let parsed;
                try { parsed = JSON.parse(xhr.responseText); }
                catch { reject(new Error(t('errUploadBadResponse'))); return; }
                if (!parsed || typeof parsed !== 'object'){ reject(new Error(t('errUploadBadResponse'))); return; }
                if (parsed.status === false){ reject(new Error(parsed.msg || t('errUploadRejected'))); return; }
                if (!parsed.filename){ reject(new Error(t('errUploadBadResponse'))); return; }
                resolve(parsed);
            };
            xhr.onerror = () => reject(new Error(t('errUploadNetwork')));
            xhr.onabort = () => reject(new Error(t('errUploadNetwork')));
            xhr.ontimeout = () => reject(new Error(t('errTimeout')));
            const fd = new FormData();
            fd.append('file', file, file.name);
            xhr.send(fd);
        });
    }

    async function handleUpload(file){
        if (!file){ failUpload(t('errUploadNoFile')); return; }
        uploadHint.textContent = '';
        dropzone.classList.add('uploading');
        setUploadProgress(file.name, 0, file.size);
        try {
            const res = await uploadFile(file);
            const item = fromUpload(res, file);
            items = items.filter(x => x.id !== item.id);
            items.unshift(item);
            save(); render();
            toast(t('toastUploaded') + ' · ' + item.name, 'ok');
            resetUploadProgress();
        } catch (err){
            failUpload(err.message || t('errUploadNetwork'));
            resetUploadProgress();
        } finally {
            dropzone.classList.remove('uploading');
            fileInput.value = '';
        }
    }

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fileInput.click(); }
    });
    fileInput.addEventListener('change', () => {
        const f = fileInput.files?.[0];
        if (f) handleUpload(f);
    });
    ['dragenter','dragover'].forEach(ev =>
        dropzone.addEventListener(ev, e => {
            e.preventDefault(); e.stopPropagation();
            dropzone.classList.add('dragover');
        })
    );
    ['dragleave','dragend','drop'].forEach(ev =>
        dropzone.addEventListener(ev, e => {
            e.preventDefault(); e.stopPropagation();
            if (ev !== 'drop') dropzone.classList.remove('dragover');
        })
    );
    dropzone.addEventListener('drop', e => {
        dropzone.classList.remove('dragover');
        const f = e.dataTransfer?.files?.[0];
        if (f) handleUpload(f);
    });
    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', e => {
        if (!e.target.closest('#dropzone')) e.preventDefault();
    });

    /* ============================================================
       Clear
       ============================================================ */
    $('#clear').addEventListener('click', () => {
        fetch('/clear').catch(() => {});
        items = []; save(); render();
        toast(t('toastCleared'));
    });

    /* ============================================================
       Polling
       ============================================================ */
    let pollRunning = false;
    async function poll(){
        if (pollRunning) return;
        const active = items.filter(i =>
            i.source !== 'upload' && !isDone(i.status) && !isFail(i.status)
        );
        if (!active.length) return;
        pollRunning = true;
        let changed = false;
        try {
            await Promise.all(active.map(async it => {
                try {
                    const res = await fetchWithTimeout('/status/' + encodeURIComponent(it.id), 10000);
                    if (!res.ok){
                        const msg = `${t('errHttp')}: HTTP ${res.status}`;
                        if (it.error !== msg){ it.error = msg; changed = true; }
                        return;
                    }
                    let text;
                    try { text = await res.text(); }
                    catch { if (it.error !== t('errEmpty')){ it.error = t('errEmpty'); changed = true; } return; }
                    if (!text || !text.trim()){
                        if (it.error !== t('errEmpty')){ it.error = t('errEmpty'); changed = true; }
                        return;
                    }
                    let parsed;
                    try { parsed = JSON.parse(text); }
                    catch { if (it.error !== t('errBadJson')){ it.error = t('errBadJson'); changed = true; } return; }
                    if (parsed && typeof parsed === 'object' && parsed.status === false){
                        const msg = t('errRejected') + (parsed.msg ? ': ' + parsed.msg : '');
                        if (it.error !== msg){ it.error = msg; changed = true; }
                        return;
                    }
                    const d = parsed?.data ?? parsed;
                    if (!d || typeof d !== 'object'){
                        if (it.error !== t('errNoData')){ it.error = t('errNoData'); changed = true; }
                        return;
                    }
                    if (it.error){ it.error = null; changed = true; }

                    const before = it.status + ':' + it.downloaded + ':' + it.size;
                    mergeApi(it, d);
                    if ((it.status + ':' + it.downloaded + ':' + it.size) !== before) changed = true;
                } catch (err){
                    const msg = err?.name === 'AbortError' ? t('errTimeout') : t('errPollLost');
                    if (it.error !== msg){ it.error = msg; changed = true; }
                }
            }));
        } finally {
            pollRunning = false;
        }
        if (changed){ save(); render(); }
    }
    setInterval(poll, 2500);

    /* ============================================================
       Theme picker
       ============================================================ */
    function currentTheme(){ return document.documentElement.dataset.theme || 'nord'; }
    function buildThemeMenu(){
        themeMenu.innerHTML = '';
        const head = document.createElement('div');
        head.className = 'popover-head';
        head.textContent = t('theme');
        themeMenu.appendChild(head);
        THEMES.forEach(th => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.setAttribute('role', 'menuitemradio');
            btn.dataset.themeVal = th.id;
            btn.setAttribute('aria-selected', String(th.id === currentTheme()));
            btn.innerHTML = `
      <span class="swatch" aria-hidden="true">
        <i style="background:${th.bg}"></i>
        <i style="background:${th.ink}"></i>
        <i style="background:${th.accent}"></i>
      </span>
      <span>${th.name}</span>`;
            btn.addEventListener('click', () => { setTheme(th.id); closeMenu(themeMenu, themeBtn); });
            themeMenu.appendChild(btn);
        });
    }
    function setTheme(id){
        document.documentElement.dataset.theme = id;
        try { localStorage.setItem('dl.theme', id); } catch {}
        themeMenu.querySelectorAll('button[data-theme-val]').forEach(b =>
            b.setAttribute('aria-selected', String(b.dataset.themeVal === id)));
    }

    /* ============================================================
       Font picker
       ============================================================ */
    function currentFont(){ return document.documentElement.dataset.font || 'auto'; }
    function buildFontMenu(){
        fontMenu.innerHTML = '';
        const head = document.createElement('div');
        head.className = 'popover-head';
        head.textContent = t('font');
        fontMenu.appendChild(head);
        FONTS.forEach(f => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.setAttribute('role', 'menuitemradio');
            btn.dataset.fontVal = f.id;
            btn.setAttribute('aria-selected', String(f.id === currentFont()));
            const previewStyle = f.family
                ? `font-family: ${f.family}, system-ui, sans-serif;`
                : '';
            btn.innerHTML = `
      <span class="font-preview" style="${previewStyle}">
        <span class="font-aa">${f.aa}</span>
        <span class="font-name" style="font-family: var(--font-body)">${f.name}</span>
      </span>`;
            btn.addEventListener('click', () => { setFont(f.id); closeMenu(fontMenu, fontBtn); });
            fontMenu.appendChild(btn);
        });
    }
    function setFont(id){
        document.documentElement.dataset.font = id;
        try { localStorage.setItem('dl.font', id); } catch {}
        fontMenu.querySelectorAll('button[data-font-val]').forEach(b =>
            b.setAttribute('aria-selected', String(b.dataset.fontVal === id)));
        updateFontBtn();
    }
    function updateFontBtn(){
        const f = FONTS.find(x => x.id === currentFont()) || FONTS[0];
        fontBtnAA.style.fontFamily = f.family ? `${f.family}, system-ui, sans-serif` : '';
    }

    /* ============================================================
       Popover helpers
       ============================================================ */
    function openMenu(menu, btn){ menu.hidden = false; btn.setAttribute('aria-expanded','true'); }
    function closeMenu(menu, btn){ menu.hidden = true; btn.setAttribute('aria-expanded','false'); }
    function closeAllMenus(){
        closeMenu(themeMenu, themeBtn);
        closeMenu(fontMenu, fontBtn);
    }
    themeBtn.addEventListener('click', e => {
        e.stopPropagation();
        const wasOpen = !themeMenu.hidden;
        closeAllMenus();
        if (!wasOpen) openMenu(themeMenu, themeBtn);
    });
    fontBtn.addEventListener('click', e => {
        e.stopPropagation();
        const wasOpen = !fontMenu.hidden;
        closeAllMenus();
        if (!wasOpen) openMenu(fontMenu, fontBtn);
    });
    document.addEventListener('click', e => {
        if (!e.target.closest('.menu-wrap')) closeAllMenus();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAllMenus(); });

    /* ============================================================
       Language
       ============================================================ */
    const langBtn = $('#lang');
    const langLabel = $('#langLabel');
    function applyLang(){
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
        setText(langLabel, lang === 'fa' ? 'EN' : 'FA');
        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.textContent = t(el.dataset.i18n);
        });
        document.querySelectorAll('[data-i18n-ph]').forEach(el => {
            el.setAttribute('placeholder', t(el.dataset.i18nPh));
        });
        const tg = document.querySelector('.tg-btn');
        if (tg) tg.setAttribute('data-tip', t('contact'));
        /* rebuild menus for the new labels */
        buildThemeMenu();
        buildFontMenu();
        nodes.forEach(n => {
            n.actionsSig = null;
            n.statsSig = null;
            n.badge.dataset.sig = '';
            n.sourceNote.dataset.sig = '';
        });
        render();
    }
    langBtn.addEventListener('click', () => {
        lang = lang === 'fa' ? 'en' : 'fa';
        try { localStorage.setItem('dl.lang', lang); } catch {}
        applyLang();
    });

    /* ============================================================
       Boot
       ============================================================ */
    buildThemeMenu();
    buildFontMenu();
    updateFontBtn();
    applyLang();
    render();
</script>
