<!doctype html>
<html lang="en" dir="ltr" data-theme="nord" data-font="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Downloader</title>

    <script>
        (function(){
            try {
                var t = localStorage.getItem('dl.theme');
                var f = localStorage.getItem('dl.font');
                var l = localStorage.getItem('dl.lang');
                if (t) document.documentElement.dataset.theme = t;
                if (f) document.documentElement.dataset.font = f;
                if (l) {
                    document.documentElement.lang = l;
                    document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
                }
            } catch(e){}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Lora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           THEMES
           ============================================================ */
        html[data-theme="nord"]{
            --bg:#2e3440; --surface: rgba(59,66,82,0.62); --surface-2: rgba(67,76,94,0.55);

        /* ============================================================
           FONT OVERRIDES — must come after theme rules
           ============================================================ */

            --font-body:'Inter',system-ui,sans-serif;

        }

        /* ============================================================
           BASE
           ============================================================ */
        *{ box-sizing:border-box; }
        html,body{ min-height:100%; }
        body{
            margin:0; background:var(--bg); color:var(--ink);
            font:15px/1.6 var(--font-body); font-weight:400;
            -webkit-font-smoothing:antialiased;
            transition:background-color .35s ease, color .35s ease;
            position:relative;
        }
        html[lang="fa"] body{ font-family:'Vazirmatn',var(--font-body); line-height:1.8; }
        body::before, body::after{
            content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
        }
        html[data-theme="nord"] body::before{
            background:
                    radial-gradient(900px 700px at 12% -5%,  rgba(136,192,208,0.075), transparent 62%),
                    radial-gradient(700px 600px at 92% 15%,  rgba(143,188,187,0.055), transparent 62%),
                    radial-gradient(800px 700px at 50% 110%, rgba(180,142,173,0.055), transparent 62%);
        }
        html[data-theme="nord"] body::after{
            background-image: radial-gradient(rgba(216,222,233,0.045) 1px, transparent 1px);
            background-size: 22px 22px;
            mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 85%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 85%);
        }
        html[data-theme="liquid"] body::before{
            background:
                    radial-gradient(800px 700px at 20% 0%,  rgba(127,199,217,0.09), transparent 60%),
                    radial-gradient(700px 600px at 85% 30%, rgba(127,199,217,0.06), transparent 60%),
                    radial-gradient(900px 800px at 50% 120%, rgba(120,180,200,0.06), transparent 60%);
        }
        html[data-theme="liquid"] body::after{
            background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 26px 26px;
            mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 85%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 85%);
        }
        html[data-theme="rosepine"] body::before{
            background:
                    radial-gradient(900px 700px at 15% -8%,  rgba(196,167,231,0.09), transparent 62%),
                    radial-gradient(700px 600px at 88% 22%,  rgba(235,188,186,0.06), transparent 62%),
                    radial-gradient(800px 700px at 50% 115%, rgba(156,207,216,0.06), transparent 62%);
        }
        html[data-theme="rosepine"] body::after{
            background-image: radial-gradient(rgba(224,222,244,0.04) 1px, transparent 1px);
            background-size: 22px 22px;
            mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 85%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 85%);
        }
        html[data-theme="tokyo"] body::before{
            background:
                    radial-gradient(900px 700px at 15% -8%,  rgba(122,162,247,0.10), transparent 62%),
                    radial-gradient(700px 600px at 88% 22%,  rgba(187,154,247,0.08), transparent 62%),
                    radial-gradient(800px 700px at 50% 115%, rgba(125,207,255,0.06), transparent 62%);
        }
        html[data-theme="tokyo"] body::after{
            background-image: radial-gradient(rgba(192,202,245,0.035) 1px, transparent 1px);
            background-size: 20px 20px;
            mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 85%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 85%);
        }
        html[data-theme="gruvbox"] body::before{
            background:
                    radial-gradient(900px 700px at 12% -5%,  rgba(250,189,47,0.06), transparent 62%),
                    radial-gradient(700px 600px at 92% 20%,  rgba(254,128,25,0.05), transparent 62%),
                    radial-gradient(800px 700px at 50% 110%, rgba(184,187,38,0.04), transparent 62%);
        }
        html[data-theme="gruvbox"] body::after{
            background-image: radial-gradient(rgba(235,219,178,0.03) 1px, transparent 1px);
            background-size: 22px 22px;
            mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 85%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 85%);
        }
        html[data-theme="paper"] body::before,
        html[data-theme="ink"] body::before{
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity:.05; mix-blend-mode:multiply;
        }
        html[data-theme="ink"] body::before{ opacity:.09; mix-blend-mode:overlay; }
        html[data-theme="solarized"] body::before{
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity:.035;
        }
        html[data-theme="dracula"] body::after,
        html[data-theme="catppuccin"] body::after{
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            mask-image: radial-gradient(ellipse at 50% 20%, #000 10%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 20%, #000 10%, transparent 80%);
        }
        html[data-theme="terminal"] body::before{
            background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(142,255,176,.028) 3px 4px);
        }
        html[data-theme="brutalist"] body::before{
            background-image: radial-gradient(#000 1px, transparent 1px);
            background-size: 20px 20px; opacity:.06;
        }

        /* ============================================================
           LAYOUT / HEADER
           ============================================================ */
        .wrap{
            position:relative; z-index:1; max-width:820px; margin:0 auto;
            padding:60px 24px 120px;
            animation:pageIn .5s cubic-bezier(.2,.8,.3,1) both;
        }
        @keyframes pageIn{ from{ opacity:0; transform:translateY(6px);} }

        header{
            position:relative; z-index:60;
            display:flex; align-items:flex-start; justify-content:space-between;
            gap:20px; margin-bottom:40px; flex-wrap:wrap;
            padding-bottom:22px;
            border-bottom:var(--border-w) solid var(--rule);
        }
        .brand{ display:flex; align-items:center; gap:14px; }
        .logo{
            width:42px; height:42px; flex:0 0 auto; border-radius:11px;
            background:var(--accent); color:var(--accent-fg);
            display:grid; place-items:center;
            transition:background .3s, color .3s, transform .35s cubic-bezier(.2,.9,.3,1.2);
            position:relative;
        }
        .logo::after{
            content:"";
            position:absolute; inset:0; border-radius:inherit;
            box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent);
            animation: logoPulse 3s ease-out infinite 1s;
            pointer-events:none;
        }
        @keyframes logoPulse{
            0%{ box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent); }
            100%{ box-shadow: 0 0 0 14px color-mix(in srgb, var(--accent) 0%, transparent); }
        }
        .logo:hover{ transform:rotate(-6deg); }
        .logo svg{ width:20px; height:20px; display:block; }
        html[data-theme="nord"] .logo{ box-shadow: 0 1px 0 rgba(255,255,255,.1) inset; }
        html[data-theme="brutalist"] .logo{
            border:var(--border-w) solid var(--rule); box-shadow:3px 3px 0 0 var(--rule);
        }
        html[data-theme="terminal"] .logo{
            background:transparent; color:var(--accent); border:1px solid var(--accent);
        }

        h1{
            font-family:var(--font-head); font-size:20px;
            font-weight:var(--head-weight); letter-spacing:var(--head-tracking);
            line-height:1.2; margin:0;
            display:flex; align-items:center; gap:9px;
        }
        html[lang="fa"] h1{ font-size:19px; }
        h1 .brand-dot{
            display:inline-block; width:6px; height:6px; border-radius:50%;
            background: var(--ok);
            animation: brandDotPulse 2.4s ease-in-out infinite;
        }
        @keyframes brandDotPulse{ 50%{ opacity:.4; } }
        .tag{ font-size:12px; color:var(--muted); margin-top:3px; letter-spacing:.005em; }
        .controls{ display:flex; align-items:center; gap:6px; flex-wrap:wrap;
            position:relative; z-index:60; }

        /* ============================================================
           TOOL BUTTONS (header)
           ============================================================ */
        .tool{
            height:36px; padding:0 12px; background:transparent;
            border:var(--border-w) solid var(--rule); border-radius:var(--btn-radius);
            color:var(--ink); cursor:pointer;
            font:inherit; font-size:12.5px; font-weight:500;
            display:inline-flex; align-items:center; gap:7px;
            transition:background .16s, border-color .16s, color .16s, transform .12s;
            -webkit-tap-highlight-color:transparent;
        }
        .tool:hover{ border-color:var(--rule-strong); background:var(--surface-2); }
        .tool:active{ transform:translateY(1px); }
        .tool svg{ width:15px; height:15px; display:block; flex:0 0 auto; }
        .tool.square{ width:36px; padding:0; justify-content:center; }
        .tool.square:hover svg{ transform:rotate(30deg); }
        .tool.square svg{ transition:transform .35s cubic-bezier(.2,.9,.3,1.3); }
        .tool .label{ font-size:12px; }
        html[data-theme="nord"] .tool{ background: rgba(59,66,82,0.5); }
        html[data-theme="nord"] .tool:hover{ background: rgba(67,76,94,0.75); }
        html[data-theme="liquid"] .tool{
            background: rgba(255,255,255,0.055);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            border-color: rgba(255,255,255,0.12);
        }
        html[data-theme="liquid"] .tool:hover{
            background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.20);
        }
        html[data-theme="brutalist"] .tool{ box-shadow:3px 3px 0 0 var(--rule); }
        html[data-theme="brutalist"] .tool:hover{
            transform:translate(-1px,-1px); box-shadow:4px 4px 0 0 var(--rule);
        }
        html[data-theme="brutalist"] .tool:active{
            transform:translate(2px,2px); box-shadow:1px 1px 0 0 var(--rule);
        }

        /* font button shows current font's "Aa" */
        #fontBtn{
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: -.01em;
            padding: 0 13px;
        }

        /* ============================================================
           POPOVER MENUS
           ============================================================ */
        .menu-wrap{ position:relative; z-index:120; }
        .popover{
            position:absolute; top:calc(100% + 8px); inset-inline-end:0;
            background:var(--bg); border:var(--border-w) solid var(--rule-strong);
            border-radius:var(--radius);
            box-shadow: 0 24px 48px -20px rgba(0,0,0,.55);
            padding:6px; min-width:240px; z-index:130;
            max-height:min(70vh,460px); overflow-y:auto;
            animation:menuIn .18s cubic-bezier(.2,.9,.3,1.2);
        }
        html[data-theme="paper"] .popover,
        html[data-theme="ink"] .popover,
        html[data-theme="solarized"] .popover,
        html[data-theme="brutalist"] .popover{ background:var(--surface); }
        html[data-theme="nord"] .popover{ background:#3b4252; border-color: rgba(216,222,233,0.14); }
        html[data-theme="liquid"] .popover{
            background: rgba(20,32,44,0.9);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border-color: rgba(255,255,255,0.14);
        }
        html[data-theme="brutalist"] .popover{ box-shadow:5px 5px 0 0 #000; }
        @keyframes menuIn{ from{ opacity:0; transform:translateY(-6px) scale(.97); } }
        .popover[hidden]{ display:none; }
        .popover button{
            display:flex; align-items:center; gap:12px;
            width:100%; padding:8px 10px; background:transparent; border:0;
            color:var(--ink); text-align:start;
            border-radius:calc(var(--radius) - 3px);
            cursor:pointer; font:inherit; font-size:13px; font-weight:450;
            transition:background .12s;
        }
        .popover button:hover{ background:var(--surface-2); }
        .popover button[aria-selected="true"]{ color:var(--accent); }
        .popover button[aria-selected="true"]::after{
            content:""; margin-inline-start:auto;
            width:5px; height:5px; border-radius:50%; background:currentColor;
        }
        html[data-theme="terminal"] .popover button[aria-selected="true"]::after{
            content:"*"; width:auto; height:auto; border-radius:0; background:none;
        }
        .popover .popover-head{
            padding: 6px 10px 8px;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: var(--border-w) solid var(--rule);
            margin-bottom: 4px;
        }
        .swatch{
            display:flex; gap:0; border:1px solid var(--rule);
            border-radius:3px; overflow:hidden; flex:0 0 auto;
        }
        .swatch i{ width:9px; height:18px; display:block; }
        .font-preview{
            display: inline-flex; align-items: baseline; gap: 8px;
            flex: 1; min-width: 0;
        }
        .font-preview .font-aa{
            font-size: 17px; font-weight: 600;
            color: var(--ink);
            min-width: 30px;
        }
        .font-preview .font-name{
            font-size: 12px; color: var(--muted);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* ============================================================
           INPUT PANEL + MODE TABS
           ============================================================ */
        .panel{
            position:relative; z-index:1; margin-bottom:36px;
            animation:pageIn .5s cubic-bezier(.2,.8,.3,1) both .08s;
        }
        html[data-theme="paper"] .panel,
        html[data-theme="ink"] .panel{
            padding-bottom:22px; border-bottom:var(--border-w) solid var(--rule);
        }
        html[data-theme="terminal"] .panel,
        html[data-theme="brutalist"] .panel,
        html[data-theme="nord"] .panel,
        html[data-theme="dracula"] .panel,
        html[data-theme="catppuccin"] .panel,
        html[data-theme="rosepine"] .panel,
        html[data-theme="tokyo"] .panel,
        html[data-theme="gruvbox"] .panel,
        html[data-theme="solarized"] .panel,
        html[data-theme="liquid"] .panel{
            background:var(--surface); border:var(--border-w) solid var(--rule);
            border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);
        }
        html[data-theme="liquid"] .panel{
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            border-color: rgba(255,255,255,0.12);
        }
        .mode-tabs{
            display:flex; gap:2px; margin:-4px -4px 16px;
            border-bottom:var(--border-w) solid var(--rule);
        }
        .mode-tabs button{
            background:transparent; border:0; border-bottom:2px solid transparent;
            color:var(--muted); cursor:pointer;
            padding:9px 12px 8px; margin-bottom:-1px;
            font:inherit; font-size:12.5px; font-weight:500;
            border-radius:0;
            display:inline-flex; align-items:center; gap:7px;
            transition:color .15s, border-color .15s, background .15s;
            -webkit-tap-highlight-color:transparent;
        }
        .mode-tabs button svg{ width:14px; height:14px; }
        .mode-tabs button:hover{ color:var(--ink); }
        .mode-tabs button.active{
            color:var(--accent);
            border-bottom-color:var(--accent);
            background: color-mix(in srgb, var(--accent) 6%, transparent);
        }
        html[data-theme="terminal"] .mode-tabs button.active{ background:transparent; }
        .mode-panel[hidden]{ display:none; }
        .mode-panel{ animation:panelIn .28s cubic-bezier(.2,.8,.3,1); }
        @keyframes panelIn{ from{ opacity:0; transform:translateY(4px);} }

        label{
            display:flex; align-items:center; gap:7px;
            font-size:11px; font-weight:600;
            color:var(--muted); letter-spacing:.07em;
            text-transform:uppercase; margin-bottom:10px;
        }
        label svg{ width:12px; height:12px; }
        html[lang="fa"] label{ text-transform:none; letter-spacing:0; font-size:12px; }
        html[data-theme="terminal"] label::before{ content:"> "; color:var(--accent); }
        .row{ display:flex; gap:8px; }
        .input-wrap{ position:relative; flex:1; min-width:0; }
        .input-wrap .in-icon{
            position:absolute; inset-inline-start:13px; top:50%;
            transform:translateY(-50%); width:15px; height:15px; color:var(--muted);
            pointer-events:none; transition:color .18s;
        }
        input[type=url]:focus ~ .in-icon{ color:var(--accent); }
        input[type=url]{
            flex:1; min-width:0; width:100%; background:transparent;
            border:var(--border-w) solid var(--rule); border-radius:var(--btn-radius);
            color:var(--ink); padding:12px 13px 12px 38px;
            font:inherit; font-size:13.5px; font-family:var(--font-mono); outline:none;
            transition:border-color .18s, background .18s, box-shadow .22s;
        }
        html[data-theme="paper"] input[type=url],
        html[data-theme="ink"] input[type=url]{ background:var(--surface); }
        html[data-theme="liquid"] input[type=url]{ background: rgba(255,255,255,0.04); }
        input[type=url]::placeholder{ color:color-mix(in srgb, var(--muted) 65%, transparent); }
        input[type=url]:focus{
            border-color:var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
        }
        input[type=url].error{
            border-color: var(--err);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--err) 22%, transparent);
            animation:shake .4s cubic-bezier(.36,.07,.19,.97);
        }
        @keyframes shake{
            10%, 90%{ transform: translateX(-1px); }
            20%, 80%{ transform: translateX(2px); }
            30%, 50%, 70%{ transform: translateX(-3px); }
            40%, 60%{ transform: translateX(3px); }
        }

        /* ============================================================
           DROPZONE
           ============================================================ */
        .dropzone{
            border: 2px dashed var(--rule-strong);
            border-radius: var(--radius);
            padding: 34px 20px;
            text-align: center;
            color: var(--muted);
            cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            transition: border-color .18s, background .18s, color .18s, transform .18s;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }
        .dropzone::before{
            content: "";
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%);
            opacity: 0; transition: opacity .3s;
            pointer-events: none;
        }
        .dropzone:hover::before,
        .dropzone.dragover::before{ opacity: 1; }
        .dropzone:hover,
        .dropzone.dragover{
            border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 5%, transparent);
            color: var(--ink);
        }
        .dropzone.dragover{ transform: scale(1.01); }
        .dropzone.uploading{ pointer-events: none; opacity: .7; border-style: solid; }
        .dropzone svg.dz-icon{ width: 32px; height: 32px; opacity: .7; position: relative; }
        .dropzone.dragover svg.dz-icon{
            animation: dzIconBounce .6s cubic-bezier(.2,.9,.3,1.4) infinite alternate;
        }
        @keyframes dzIconBounce{
            from{ transform: translateY(0); }
            to  { transform: translateY(-5px); }
        }
        .dropzone .dz-title{ font-size: 13.5px; font-weight: 500; color: var(--ink); position: relative; }
        .dropzone .dz-hint{ font-size: 11.5px; opacity: .8; font-family: var(--font-mono); position: relative; }

        .upload-progress{
            margin-top: 14px;
            display: flex; flex-direction: column; gap: 8px;
            animation: panelIn .25s cubic-bezier(.2,.8,.3,1);
        }
        .upload-progress[hidden]{ display: none; }
        .upload-progress .up-info{
            display: flex; justify-content: space-between; gap: 12px;
            font-family: var(--font-mono); font-size: 11.5px; color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .upload-progress .up-name{
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: var(--ink-soft); font-weight: 500;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .upload-progress .up-name svg{ width: 12px; height: 12px; color: var(--muted); flex: 0 0 auto; }
        .upload-progress .up-bar{
            height: 4px; background: var(--rule);
            border-radius: 99px; overflow: hidden; position: relative;
        }
        html[data-theme="brutalist"] .upload-progress .up-bar{
            height: 10px; border: 1px solid var(--rule); border-radius: 0;
        }
        .upload-progress .up-bar i{
            display: block; height: 100%; width: 0;
            background: var(--accent);
            border-radius: inherit;
            transition: width .35s cubic-bezier(.22,.61,.36,1);
            position: relative;
        }
        .upload-progress .up-bar i::after{
            content:""; position:absolute; inset:0;
            background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
            animation:shimmer 1.6s ease-in-out infinite;
        }
        html[data-theme="nord"] .upload-progress .up-bar i{
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
        }
        html[data-theme="brutalist"] .upload-progress .up-bar i{
            background: repeating-linear-gradient(45deg,#000 0 6px,transparent 6px 12px), var(--accent);
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        button, .btn{
            font:inherit; font-size:13.5px; cursor:pointer;
            border-radius:var(--btn-radius); padding:12px 18px;
            border:var(--border-w) solid transparent;
            transition:background .16s, border-color .16s, color .16s,
            transform .1s, box-shadow .2s, filter .16s, opacity .16s;
            white-space:nowrap; text-decoration:none;
            display:inline-flex; align-items:center; justify-content:center; gap:7px;
            -webkit-tap-highlight-color:transparent;
        }
        .btn svg{ width:14px; height:14px; display:block; flex:0 0 auto; }
        .primary{
            background:var(--accent); color:var(--accent-fg);
            border-color:var(--accent); font-weight:600; letter-spacing:.005em;
        }
        .primary:hover{ filter:brightness(1.06); transform:translateY(-1px); }
        .primary:active{ transform:translateY(0) scale(.99); }
        .primary:disabled{ opacity:.55; cursor:default; transform:none; filter:none; }
        html[data-theme="brutalist"] .primary{
            border-color:var(--rule); box-shadow:4px 4px 0 0 var(--rule);
        }
        html[data-theme="brutalist"] .primary:hover{
            filter:none; transform:translate(-1px,-1px);
            box-shadow:5px 5px 0 0 var(--rule);
        }
        html[data-theme="brutalist"] .primary:active{
            transform:translate(3px,3px); box-shadow:1px 1px 0 0 var(--rule);
        }
        html[data-theme="brutalist"] .primary:disabled{ box-shadow:4px 4px 0 0 var(--rule); }
        .primary.loading{ gap:9px; }
        .primary.loading::after{
            content:""; width:12px; height:12px; border-radius:50%;
            border:1.6px solid color-mix(in srgb, currentColor 30%, transparent);
            border-top-color:currentColor; animation:spin .65s linear infinite;
        }
        html[data-theme="terminal"] .primary.loading::after{ border-radius:0; }
        @keyframes spin{ to{ transform:rotate(360deg); } }

        .btn{
            background:transparent; border-color:var(--rule);
            color:var(--ink); padding:8px 13px; font-size:12.5px;
        }
        .btn:hover{ border-color:var(--rule-strong); background:var(--surface-2); }
        .btn:active{ transform:translateY(1px); }
        .btn:disabled, .btn.is-disabled{
            opacity:.35; cursor:not-allowed; pointer-events:none;
            transform:none !important; filter:none !important;
        }
        html[data-theme="liquid"] .btn{
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-color: rgba(255,255,255,0.10);
        }
        html[data-theme="liquid"] .btn:hover{
            background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.18);
        }
        html[data-theme="brutalist"] .btn{ box-shadow:3px 3px 0 0 var(--rule); }
        html[data-theme="brutalist"] .btn:hover{
            transform:translate(-1px,-1px); box-shadow:4px 4px 0 0 var(--rule);
        }
        html[data-theme="brutalist"] .btn:active{
            transform:translate(2px,2px); box-shadow:1px 1px 0 0 var(--rule);
        }
        .btn.ghost{ border-color:transparent; color:var(--muted); background:transparent; }
        .btn.ghost:hover{ color:var(--ink); border-color:var(--rule); background:transparent; }

        .hint{
            margin:11px 0 0; font-size:12.5px; color:var(--err);
            font-family:var(--font-mono);
            display:flex; align-items:flex-start; gap:7px;
            animation:hintIn .3s cubic-bezier(.2,.8,.3,1) both;
        }
        .hint svg{ width:13px; height:13px; flex:0 0 auto; margin-top:2px; }
        @keyframes hintIn{ from{ opacity:0; transform:translateY(-4px);} }
        .hint:empty{ display:none; }

        /* ============================================================
           LIST HEAD
           ============================================================ */
        .list-head{
            display:flex; align-items:center; justify-content:space-between;
            gap:16px; margin-bottom:8px;
        }
        .list-head h2{
            font-family:var(--font-head); font-size:12px; font-weight:600;
            letter-spacing:.1em; text-transform:uppercase;
            color:var(--muted); margin:0;
            display:flex; align-items:center; gap:8px;
        }
        .list-head h2 svg{ width:13px; height:13px; }
        .list-head .count{
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 20px; height: 18px; padding: 0 6px;
            font-size: 10.5px; font-weight: 600;
            letter-spacing: 0;
            border-radius: 99px;
            background: var(--surface-2);
            border: var(--border-w) solid var(--rule);
            color: var(--muted);
            font-family: var(--font-mono);
        }
        html[lang="fa"] .list-head h2{ text-transform:none; letter-spacing:0; font-size:12.5px; }
        html[data-theme="terminal"] .list-head h2{ font-family:var(--font-mono); color:var(--accent); }
        html[data-theme="terminal"] .list-head h2::before{ content:"## "; }
        html[data-theme="brutalist"] .list-head h2{ letter-spacing:-.02em; font-size:14px; }

        .list{ display:flex; flex-direction:column; }

        /* ============================================================
           CARD
           ============================================================ */
        .card{
            animation:cardIn .45s cubic-bezier(.2,.8,.3,1) both;
            animation-delay:calc(var(--i,0) * 40ms);
            transition:border-color .2s, background .3s, box-shadow .3s, transform .2s;
            position: relative;
        }
        @keyframes cardIn{
            from{ opacity:0; transform:translateY(14px); }
            to  { opacity:1; transform:translateY(0); }
        }
        html[data-theme="paper"] .card,
        html[data-theme="ink"] .card{
            padding:18px 0; border-top:var(--border-w) solid var(--rule);
        }
        html[data-theme="paper"] .card:hover,
        html[data-theme="ink"] .card:hover{ border-top-color:var(--rule-strong); }
        html[data-theme="terminal"] .card,
        html[data-theme="brutalist"] .card,
        html[data-theme="nord"] .card,
        html[data-theme="dracula"] .card,
        html[data-theme="catppuccin"] .card,
        html[data-theme="rosepine"] .card,
        html[data-theme="tokyo"] .card,
        html[data-theme="gruvbox"] .card,
        html[data-theme="solarized"] .card,
        html[data-theme="liquid"] .card{
            background:var(--surface); border:var(--border-w) solid var(--rule);
            border-radius:var(--radius); padding:15px; margin-bottom:10px;
            box-shadow:var(--shadow);
            overflow: hidden;
        }
        html[data-theme="liquid"] .card{
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border-color: rgba(255,255,255,0.10);
        }
        html[data-theme="liquid"] .card:hover{ border-color: rgba(255,255,255,0.18); }
        html[data-theme="terminal"] .card:hover{ border-color:var(--accent); }
        html[data-theme="nord"] .card:hover,
        html[data-theme="dracula"] .card:hover,
        html[data-theme="catppuccin"] .card:hover,
        html[data-theme="rosepine"] .card:hover,
        html[data-theme="tokyo"] .card:hover,
        html[data-theme="gruvbox"] .card:hover,
        html[data-theme="solarized"] .card:hover{ border-color:var(--rule-strong); }

        /* accent stripe on cards (not for editorial themes) */
        html[data-theme="terminal"] .card::before,
        html[data-theme="nord"] .card::before,
        html[data-theme="dracula"] .card::before,
        html[data-theme="catppuccin"] .card::before,
        html[data-theme="rosepine"] .card::before,
        html[data-theme="tokyo"] .card::before,
        html[data-theme="gruvbox"] .card::before,
        html[data-theme="solarized"] .card::before,
        html[data-theme="liquid"] .card::before{
            content: "";
            position: absolute; inset-inline-start: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--muted);
            opacity: .35;
            transition: background .3s, opacity .3s;
        }
        html[data-theme="liquid"] .card::before{
            border-top-left-radius: var(--radius);
            border-bottom-left-radius: var(--radius);
        }
        .card:has(.badge.busy)::before{ background: var(--warn); opacity: .85; }
        .card:has(.badge.ok)::before{ background: var(--ok); opacity: .85; }
        .card:has(.badge.err)::before{ background: var(--err); opacity: .85; }

        .card.just-done{ animation:doneFlash 1.1s ease; }
        @keyframes doneFlash{
            0%{ background: color-mix(in srgb, var(--ok) 22%, var(--surface)); }
            100%{ background: var(--surface); }
        }
        html[data-theme="nord"] .card.just-done{ animation:doneFlashN 1.2s ease; }
        @keyframes doneFlashN{
            0%{ background: rgba(163,190,140,0.14); box-shadow: 0 0 0 0 rgba(163,190,140,0.4), var(--shadow); }
            60%{ box-shadow: 0 0 0 14px rgba(163,190,140,0), var(--shadow); }
            100%{ background: var(--surface); box-shadow: var(--shadow); }
        }
        html[data-theme="brutalist"] .card.just-done{ animation:doneFlashB 1.1s ease; }
        @keyframes doneFlashB{
            0%,100%{ box-shadow:5px 5px 0 0 var(--rule); }
            40%{ box-shadow:5px 5px 0 0 var(--ok); }
        }

        .card-top{
            display:flex; align-items:flex-start; justify-content:space-between;
            gap:14px; margin-bottom:12px;
        }
        .meta{ min-width:0; flex:1; display:flex; gap:12px; align-items:flex-start; }
        .file-icon{
            flex:0 0 auto; width:38px; height:38px;
            display:grid; place-items:center;
            border-radius:calc(var(--radius) - 4px);
            background:var(--surface-2); color:var(--muted);
            transition:background .25s, color .25s;
            position: relative;
        }
        .file-icon svg{ width:17px; height:17px; }
        html[data-theme="liquid"] .file-icon{ background: rgba(255,255,255,0.07); }
        .card:has(.badge.ok) .file-icon{ color:var(--ok); }
        .card:has(.badge.err) .file-icon{ color:var(--err); }
        .card:has(.badge.busy) .file-icon{ color:var(--accent); }
        .card.just-done .file-icon svg{ animation:iconBounce .6s cubic-bezier(.2,.9,.3,1.4); }
        @keyframes iconBounce{
            0%,100%{ transform:scale(1) rotate(0); }
            50%{ transform:scale(1.18) rotate(-4deg); }
        }
        /* status dot on file icon */
        .file-icon .status-dot{
            position: absolute; bottom: -2px; inset-inline-end: -2px;
            width: 11px; height: 11px; border-radius: 50%;
            background: var(--muted);
            border: 2px solid var(--bg);
            transition: background .3s, transform .3s;
        }
        html[data-theme="paper"] .file-icon .status-dot,
        html[data-theme="ink"] .file-icon .status-dot{ border-color: var(--bg); }
        .card:has(.badge.busy) .file-icon .status-dot{
            background: var(--warn);
            animation: statusDotPulse 1.4s ease-in-out infinite;
        }
        .card:has(.badge.ok) .file-icon .status-dot{ background: var(--ok); }
        .card:has(.badge.err) .file-icon .status-dot{ background: var(--err); }
        @keyframes statusDotPulse{
            0%, 100%{ transform: scale(1); opacity: 1; }
            50%{ transform: scale(1.25); opacity: .75; }
        }

        .name{
            font-size:14px; font-weight:500;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            line-height:1.35; letter-spacing:-.005em;
        }
        html[data-theme="terminal"] .name{
            font-family:var(--font-mono); font-weight:500; font-size:13px;
        }
        html[data-theme="terminal"] .name::before{ content:"$ "; color:var(--muted); }
        html[lang="fa"] .name{ font-size:13.5px; }

        .sub{
            font-size:11.5px; color:var(--muted); margin-top:4px;
            font-family:var(--font-mono);
            font-variant-numeric:tabular-nums; letter-spacing:.005em;
            display:flex; align-items:center; gap:8px;
            min-width:0;
        }
        .sub .sub-text{
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            min-width:0; flex:1;
        }
        .sub .note{
            flex:0 0 auto; font-size:11px; font-weight:500;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .sub .note svg{ width: 10px; height: 10px; }
        .sub .note.warn{ color: var(--warn); }
        .sub .note.muted{ color: var(--muted); font-style:italic; }
        .sub .note.source{ color: var(--accent); opacity: .9; }

        .stats{
            display:flex; align-items:center; flex-wrap:wrap;
            gap:6px 14px;
            margin-top:6px;
            font-family:var(--font-mono);
            font-size:11.5px;
            color:var(--ink-soft);
            font-variant-numeric:tabular-nums;
            min-height:16px;
        }
        .stats .stat{
            display:inline-flex; align-items:center; gap:5px;
            white-space:nowrap;
        }
        .stats .stat svg{ width:12px; height:12px; color:var(--muted); flex:0 0 auto; }
        .stats .stat .val{ color: var(--ink); }
        .stats .stat.muted .val{ color: var(--muted); }
        .stats .sep{ color: var(--muted); opacity:.5; }

        .card-error{
            display: flex; align-items: flex-start; gap: 8px;
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: var(--btn-radius);
            background: color-mix(in srgb, var(--err) 11%, transparent);
            border: 1px solid color-mix(in srgb, var(--err) 30%, transparent);
            color: var(--err);
            font-size: 11.5px;
            font-family: var(--font-mono);
            line-height: 1.4;
            animation: errIn .3s cubic-bezier(.2,.8,.3,1) both;
        }
        .card-error svg{ width: 13px; height: 13px; flex: 0 0 auto; margin-top: 2px; }
        .card-error[hidden]{ display: none; }
        @keyframes errIn{
            from{ opacity: 0; transform: translateY(-3px); }
            to  { opacity: 1; transform: translateY(0); }
        }

        .badge{
            font-size:10.5px; font-weight:600;
            letter-spacing:.08em; text-transform:uppercase;
            white-space:nowrap; flex:0 0 auto; padding:4px 0;
            color:var(--muted); transition:color .2s;
            display:inline-flex; align-items:center; gap:6px;
        }
        .badge svg{ width:11px; height:11px; }
        html[lang="fa"] .badge{ text-transform:none; letter-spacing:0; font-size:11.5px; }
        .badge.busy{ color:var(--warn); }
        .badge.ok{ color:var(--ok); }
        .badge.err{ color:var(--err); }
        html[data-theme="terminal"] .badge::before{ content:"["; opacity:.5; }
        html[data-theme="terminal"] .badge::after{ content:"]"; opacity:.5; }
        html[data-theme="brutalist"] .badge{
            border:1px solid var(--rule); padding:3px 7px;
            background:var(--surface); font-size:10px;
        }
        html[data-theme="brutalist"] .badge.ok{ background:var(--ok); color:#fff; border-color:var(--rule); }
        html[data-theme="brutalist"] .badge.busy{ background:var(--warn); color:#000; border-color:var(--rule); }
        html[data-theme="brutalist"] .badge.err{ background:var(--err); color:#fff; border-color:var(--rule); }

        .bar{
            height:4px; background:var(--rule); overflow:hidden;
            position:relative; border-radius:99px;
        }
        html[data-theme="brutalist"] .bar{ height:12px; border:1px solid var(--rule); border-radius:0; }
        html[data-theme="paper"] .bar,
        html[data-theme="ink"] .bar{ border-radius:0; height:2px; }
        .bar i{
            display:block; height:100%; width:0;
            background:var(--accent);
            transition:width .7s cubic-bezier(.22,.61,.36,1);
            position:relative; border-radius:inherit;
            will-change: width;
        }
        html[data-theme="brutalist"] .bar i{
            background:repeating-linear-gradient(45deg,#000 0 6px,transparent 6px 12px), var(--accent);
        }
        html[data-theme="nord"] .bar i{
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
        }
        html[data-theme="tokyo"] .bar i{
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
        }
        html[data-theme="gruvbox"] .bar i{
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
        }
        html[data-theme="rosepine"] .bar i{
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
        }
        html[data-theme="liquid"] .bar{ background: rgba(255,255,255,0.07); }
        html[data-theme="liquid"] .bar i{
            background: var(--accent);
            box-shadow: 0 0 8px rgba(127,199,217,0.5);
        }
        .card:has(.badge.busy) .bar i::after{
            content:""; position:absolute; inset:0;
            background:linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
            animation:shimmer 1.8s ease-in-out infinite;
        }
        @keyframes shimmer{
            0%{ transform:translateX(-100%); }
            100%{ transform:translateX(100%); }
        }
        .card.is-unknown-size:has(.badge.busy) .bar i{
            animation:indeterminate 1.9s cubic-bezier(.4,.1,.3,1) infinite;
        }
        @keyframes indeterminate{
            0%{ margin-inline-start:-40%; width:40%; }
            50%{ margin-inline-start:20%; width:60%; }
            100%{ margin-inline-start:100%; width:40%; }
        }

        .actions{
            display:flex; gap:6px; flex-wrap:wrap;
            margin-top:13px; align-items:center;
        }
        .small{ font-size:11.5px; }
        .muted{ color:var(--muted); }

        .player{
            width:100%; margin-top:13px;
            border-radius:var(--radius); background:#000;
            border:var(--border-w) solid var(--rule);
            display:block;
            animation:playerIn .35s cubic-bezier(.2,.8,.3,1) both;
        }
        html[data-theme="brutalist"] .player{ box-shadow:5px 5px 0 0 var(--rule); }
        @keyframes playerIn{
            from{ opacity:0; transform:scale(.98); }
            to  { opacity:1; transform:scale(1); }
        }
        .player[hidden]{ display:none; }

        /* ============================================================
           EMPTY
           ============================================================ */
        .empty{
            text-align:center; color:var(--muted); font-size:13px;
            padding:64px 20px;
            display:flex; flex-direction:column; align-items:center; gap:16px;
            animation:fadeIn .5s ease both;
            border: 1px dashed var(--rule);
            border-radius: var(--radius);
            margin-top: 4px;
        }
        html[data-theme="paper"] .empty,
        html[data-theme="ink"] .empty{ border: 0; border-top: var(--border-w) dashed var(--rule); border-radius: 0; padding-left: 0; padding-right: 0; }
        .empty .empty-art{
            width: 72px; height: 72px;
            border-radius: 20px;
            background: var(--surface-2);
            display: grid; place-items: center;
            color: var(--muted);
            position: relative;
            margin-bottom: 4px;
        }
        .empty .empty-art::before{
            content: ""; position: absolute; inset: -4px;
            border-radius: 24px;
            border: 1px dashed var(--rule-strong);
            opacity: .6;
            animation: emptySpin 20s linear infinite;
        }
        @keyframes emptySpin{ to{ transform: rotate(360deg); } }
        .empty .empty-art svg{ width: 32px; height: 32px; opacity: .7; }
        .empty .empty-title{
            font-family: var(--font-head);
            font-size: 15px; font-weight: 600;
            color: var(--ink-soft);
            letter-spacing: -.01em;
        }
        .empty .empty-hint{
            font-size: 12px;
            color: var(--muted);
            max-width: 320px;
            font-family: var(--font-mono);
            line-height: 1.55;
        }
        html[lang="fa"] .empty .empty-hint{ font-family: var(--font-body); }
        html[data-theme="terminal"] .empty .empty-hint::after{
            content:"_"; color:var(--accent); animation:blink 1s step-end infinite;
        }
        @keyframes blink{ 50%{ opacity:0; } }
        @keyframes fadeIn{ from{ opacity:0; } }

        /* ============================================================
           TOASTS
           ============================================================ */
        .toasts{
            position:fixed; inset-inline:0; bottom:24px; z-index:200;
            display:flex; flex-direction:column; align-items:center; gap:8px;
            pointer-events:none; padding-inline:16px;
        }
        .toast{
            pointer-events:auto; background:var(--bg);
            border:var(--border-w) solid var(--rule-strong);
            color:var(--ink); padding:10px 15px;
            border-radius:var(--radius); font-size:12.5px;
            font-family:var(--font-mono);
            box-shadow: 0 24px 48px -20px rgba(0,0,0,.55);
            transform:translateY(20px); opacity:0;
            transition:transform .35s cubic-bezier(.2,.9,.3,1.2), opacity .25s;
            max-width:min(520px, 92vw);
            display:flex; align-items:flex-start; gap:9px;
            line-height: 1.4;
        }
        html[data-theme="nord"] .toast{ background:#3b4252; }
        html[data-theme="liquid"] .toast{
            background: rgba(20,32,44,0.9);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border-color: rgba(255,255,255,0.14);
        }
        .toast svg{ width:13px; height:13px; flex:0 0 auto; margin-top:2px; }
        html[data-theme="brutalist"] .toast{ box-shadow:5px 5px 0 0 var(--rule); background:var(--surface); }
        .toast.show{ transform:translateY(0); opacity:1; }
        .toast.ok{ border-color:var(--ok); color:var(--ok); }
        .toast.err{ border-color:var(--err); color:var(--err); }

        /* ============================================================
           TELEGRAM BUTTON
           ============================================================ */
        .tg-btn{
            position:fixed; inset-inline-end:22px; bottom:22px; z-index:90;
            width:46px; height:46px; border-radius:50%;
            background:#229ed9; color:#fff;
            display:grid; place-items:center;
            text-decoration:none; cursor:pointer; border:0;
            box-shadow:0 10px 26px -10px rgba(34,158,217,.65);
            transition:transform .25s cubic-bezier(.2,.9,.3,1.3), box-shadow .25s, filter .2s;
        }
        .tg-btn:hover{
            transform:translateY(-3px) scale(1.05);
            box-shadow:0 16px 34px -12px rgba(34,158,217,.85);
            filter:brightness(1.06);
        }
        .tg-btn:active{ transform:scale(.95); }
        .tg-btn svg{ width:21px; height:21px; display:block; }
        .tg-btn::before{
            content:""; position:absolute; inset:-4px; border-radius:50%;
            border:1.5px solid #229ed9;
            opacity:0; animation:tgPulse 3s ease-out infinite 1.6s;
            pointer-events:none;
        }
        @keyframes tgPulse{
            0%{ transform:scale(.9); opacity:.5; }
            100%{ transform:scale(1.6); opacity:0; }
        }
        .tg-btn::after{
            content:attr(data-tip);
            position:absolute; inset-inline-end:calc(100% + 10px);
            top:50%; transform:translateY(-50%) translateX(4px);
            background:var(--bg); color:var(--ink);
            border:var(--border-w) solid var(--rule-strong);
            padding:6px 11px; border-radius:var(--radius);
            font-size:12px; white-space:nowrap;
            opacity:0; pointer-events:none;
            transition:opacity .2s, transform .2s;
            box-shadow: 0 12px 30px -14px rgba(0,0,0,.6);
            font-family:var(--font-body);
        }
        html[data-theme="nord"] .tg-btn::after{ background:#3b4252; }
        html[data-theme="liquid"] .tg-btn::after{
            background: rgba(20,32,44,0.92);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-color: rgba(255,255,255,0.14);
        }
        .tg-btn:hover::after{ opacity:1; transform:translateY(-50%) translateX(0); }

        html[dir="rtl"] .row{ flex-direction:row-reverse; }
        html[dir="rtl"] input[type=url]{ text-align:right; padding:12px 38px 12px 13px; }
        html[dir="rtl"] .input-wrap .in-icon{ inset-inline-start:auto; inset-inline-end:13px; }
        html[dir="rtl"] .bar{ direction:ltr; }
        html[dir="rtl"] .tg-btn::after{
            inset-inline-end:auto; inset-inline-start:calc(100% + 10px);
            transform:translateY(-50%) translateX(-4px);
        }
        html[dir="rtl"] .tg-btn:hover::after{ transform:translateY(-50%) translateX(0); }

        @media (prefers-reduced-motion: reduce){
            *, *::before, *::after{
                animation-duration:.01ms !important;
                animation-iteration-count:1 !important;
                transition-duration:.01ms !important;
            }
        }

        @media (max-width:600px){
            .wrap{ padding:32px 16px 108px; }
            .row{ flex-direction:column; }
            html[dir="rtl"] .row{ flex-direction:column; }
            .primary{ width:100%; }
            header{ margin-bottom:28px; }
            .controls{ width:100%; justify-content:flex-end; }
            h1{ font-size:17px; }
            .tg-btn{ inset-inline-end:14px; bottom:14px; width:42px; height:42px; }
            .tg-btn::after{ display:none; }
        }
    </style>
</head>

<script>
    /* ============================================================
       THEMES
       ============================================================ */
    const THEMES = [
        { id:'nord',       name:'Nord',             bg:'#2e3440', ink:'#eceff4', accent:'#88c0d0' },
        { id:'tokyo',      name:'Tokyo Night',      bg:'#1a1b26', ink:'#c0caf5', accent:'#7aa2f7' },
        { id:'rosepine',   name:'Rosé Pine',        bg:'#232136', ink:'#e0def4', accent:'#c4a7e7' },
        { id:'catppuccin', name:'Catppuccin Mocha', bg:'#1e1e2e', ink:'#cdd6f4', accent:'#cba6f7' },

            }));

    /* ============================================================
       Idempotent DOM writers
       ============================================================ */
    function setText(el, txt){ if (el.textContent !== txt) el.textContent = txt; }
    function setHidden(el, h){ if (el.hidden !== h) el.hidden = h; }
    function setClass(el, c){ if (el.className !== c) el.className = c; }
    function setWidth(el, w){ if (el.style.width !== w) el.style.width = w; }
    function setAttr(el, n, v){ if (el.getAttribute(n) !== v) el.setAttribute(n, v); }

    /* ============================================================
       Clipboard (with fallback for non-secure contexts)
       ============================================================ */
    async function copyText(text){
        if (navigator.clipboard && window.isSecureContext){
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch {}
        }
        try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.top = '0';
            ta.style.left = '0';
            ta.style.opacity = '0';
            ta.style.pointerEvents = 'none';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            ta.setSelectionRange(0, text.length);
            const ok = document.execCommand('copy');
            document.body.removeChild(ta);
            return ok;
        } catch { return false; }
    }

    /* ============================================================
       Toasts
       ============================================================ */
    function toast(msg, type = '', ms = 2800){
        const el = document.createElement('div');
        el.className = 'toast ' + type;
        el.innerHTML = (type === 'ok' ? ICON.check : type === 'err' ? ICON.alert : '') + '<span></span>';
        el.querySelector('span').textContent = msg;
        toastsEl.appendChild(el);
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => {
            el.classList.remove('show');
            el.addEventListener('transitionend', () => el.remove(), { once:true });
        }, ms);
    }

    /* ============================================================
       Fetch with timeout
       ============================================================ */
    async function fetchWithTimeout(url, ms = 15000){
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), ms);
        try {
            return await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
        } finally {
            clearTimeout(timer);
        }
    }

            status: d.file_dl_status || 'DOWNLOADING',
            at: Number(d.file_creation_date) || Date.now(),
            startedAt: Date.now(),
            finishedAt: null,
            directUri: null,
            source: 'url',
            error: null
