            errRejected:'سرور درخواست را رد کرد',
            errPollLost:'ارتباط با سرور قطع شد. تلاش مجدد…',
            errCopy:'کپی در حافظه ممکن نشد.',
            toastStarted:'دانلود شروع شد',
            toastCleared:'پاک شد',
            toastRemoved:'حذف شد',
            theme:'پوسته', contact:'تماس در تلگرام'
        }
    };

    let lang = document.documentElement.lang === 'fa' ? 'fa' : 'en';
    const t = k => (I18N[lang] && I18N[lang][k]) ?? I18N.en[k] ?? k;

    /* ============================================================
       Icons
       ============================================================ */
    const S = 'fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"';
    const ICON = {
        file:  `<svg viewBox="0 0 24 24" ${S}><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>`,
        video: `<svg viewBox="0 0 24 24" ${S}><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>`,
        play:  `<svg viewBox="0 0 24 24" ${S}><path d="M6 4.5 19 12 6 19.5z"/></svg>`,
        save:  `<svg viewBox="0 0 24 24" ${S}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
        copy:  `<svg viewBox="0 0 24 24" ${S}><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
        trash: `<svg viewBox="0 0 24 24" ${S}><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`,
        check: `<svg viewBox="0 0 24 24" ${S}><polyline points="20 6 9 17 4 12"/></svg>`,
        alert: `<svg viewBox="0 0 24 24" ${S}><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
        inbox: `<svg viewBox="0 0 24 24" ${S}><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`,
        down:  `<svg viewBox="0 0 24 24" ${S}><path d="M12 5v14"/><path d="m5 12 7 7 7-7"/></svg>`,
        clock: `<svg viewBox="0 0 24 24" ${S}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
        hour:  `<svg viewBox="0 0 24 24" ${S}><circle cx="12" cy="12" r="9"/><path d="M12 8v4h4"/></svg>`,
    };

    /* ============================================================
       DOM
       ============================================================ */
    const $ = (s, r = document) => r.querySelector(s);
    const listEl = $('#list'), urlEl = $('#url'), goEl = $('#go'), hintEl = $('#hint');
    const toastsEl = $('#toasts');
    const themeBtn = $('#themeBtn'), themeMenu = $('#themeMenu');
    const KEY = 'dl.items.v5';

    let items = load();
    function load(){
        try {
            const raw = JSON.parse(localStorage.getItem(KEY)) || [];
            return raw.map(it => ({
                ...it,
                error: null,
                startedAt: it.startedAt || it.at || Date.now(),
                finishedAt: it.finishedAt || null,
            }));
        } catch { return []; }
    }
    function save(){
        try {
            const clean = items.map(({ error, ...rest }) => rest);
            localStorage.setItem(KEY, JSON.stringify(clean));
        } catch {}
    }

    /* ============================================================
       Idempotent DOM writers — only touch the DOM when the value
       actually changes, so animations never restart on a poll.
       ============================================================ */
    function setText(el, txt){ if (el.textContent !== txt) el.textContent = txt; }
    function setHidden(el, hidden){ if (el.hidden !== hidden) el.hidden = hidden; }
    function setClass(el, cls){ if (el.className !== cls) el.className = cls; }
    function setWidth(el, w){ if (el.style.width !== w) el.style.width = w; }
    function setAttr(el, name, val){ if (el.getAttribute(name) !== val) el.setAttribute(name, val); }

    /* ============================================================
       Toasts
       ============================================================ */
    function toast(msg, type = '', ms = 2800){
        const el = document.createElement('div');
        el.className = 'toast ' + type;
        el.innerHTML = (type === 'ok' ? ICON.check : type === 'err' ? ICON.alert : '') + '<span></span>';
        el.querySelector('span').textContent = msg;
        toastsEl.appendChild(el);
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => {
            el.classList.remove('show');
            el.addEventListener('transitionend', () => el.remove(), { once:true });
        }, ms);
    }

    /* ============================================================
       Fetch with timeout
       ============================================================ */
    async function fetchWithTimeout(url, ms = 15000){
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), ms);
        try {
            return await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
        } finally {
            clearTimeout(timer);
        }
    }

    /* ============================================================
       API helpers
       ============================================================ */
    function fromApi(d, fallbackUrl){
        return {
            id: d.file_id,
            name: d.file_name || nameFromUrl(fallbackUrl || d.file_url || ''),
            url: d.file_url || fallbackUrl || '',
            size: Number(d.file_size) || 0,
            downloaded: Number(d.file_current_dl_size) || 0,
            status: d.file_dl_status || 'DOWNLOADING',
            at: Number(d.file_creation_date) || Date.now(),
            startedAt: Date.now(),
            finishedAt: null,
            error: null
        };
    }

    function mergeApi(it, d){
        if (d.file_dl_status) it.status = d.file_dl_status;
        if (d.file_current_dl_size != null) it.downloaded = Number(d.file_current_dl_size) || 0;
        if (d.file_size != null) it.size = Number(d.file_size);
        if (d.file_name) it.name = d.file_name;
        if (d.file_url) it.url = d.file_url;
    }

    /* ============================================================
       Format helpers
       ============================================================ */
    function fmtBytes(n){
        n = Number(n);
        if (!isFinite(n) || n <= 0) return '';
        const u = ['B','KB','MB','GB','TB']; let i = 0;
        while (n >= 1024 && i < u.length - 1){ n /= 1024; i++; }
        return n.toFixed(i && n < 10 ? 1 : 0) + ' ' + u[i];
    }

    /* Speed in MB/s (adaptive for slow links) */
    function fmtSpeed(bps){
        if (!isFinite(bps) || bps <= 0) return '';
        const mb = bps / (1024 * 1024);
        if (mb >= 1) return mb.toFixed(2) + ' MB/s';
        const kb = bps / 1024;
        if (kb >= 1) return kb.toFixed(0) + ' KB/s';
        return bps.toFixed(0) + ' B/s';
    }

    function fmtDuration(sec){
        sec = Math.max(0, Math.round(sec));
        if (sec < 60) return sec + 's';
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        if (m < 60) return m + 'm ' + s + 's';
        const h = Math.floor(m / 60);
        const mm = m % 60;
        return h + 'h ' + mm + 'm';
    }

    function fmtElapsed(ms){
        const sec = Math.max(0, Math.round(ms / 1000));
        if (sec < 60) return sec + 's';
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        if (m < 60) return m + 'm ' + s + 's';
        const h = Math.floor(m / 60);
        const mm = m % 60;
        return h + 'h ' + mm + 'm';
    }

    const up = s => String(s ?? '').toUpperCase();
    const isDone = s => ['FINISHED','DONE','COMPLETED','SUCCESS'].includes(up(s));
    const isFail = s => ['FAILED','ERROR','CANCELED','CANCELLED'].includes(up(s));

    function statusKey(s){
        if (isDone(s)) return 'ready';
        if (isFail(s)) return 'failed';
        if (!s) return 'queued';
        if (up(s) === 'DOWNLOADING') return 'downloading';
        return null;
    }
    function label(s){
        const k = statusKey(s);
        return k ? t(k) : (up(s)[0] + up(s).slice(1).toLowerCase());
    }

    function nameFromUrl(u){
        try { return decodeURIComponent(new URL(u).pathname.split('/').pop() || 'file'); }
        catch { return 'file'; }
    }

    function fileIcon(name, url){
        const ext = (name || url || '').split('.').pop().toLowerCase();
        if (['mp4','mkv','webm','mov','avi','m4v'].includes(ext)) return ICON.video;
        return ICON.file;
    }

    /* ============================================================
       Speed sampling — rolling 30 s window per card
       ============================================================ */
    const SAMPLE_WINDOW_MS = 30_000;
    const SAMPLE_MIN_GAP_MS = 800;

    function pushSample(n, bytes){
        if (!n.samples) n.samples = [];
        const now = performance.now();
        const last = n.samples[n.samples.length - 1];
        if (last){
            const dt = now - last.t;
            if (last.bytes === bytes && dt < 3000) return;
            if (dt < SAMPLE_MIN_GAP_MS) return;
        }
        n.samples.push({ t: now, bytes });
        const cutoff = now - SAMPLE_WINDOW_MS;
        while (n.samples.length > 2 && n.samples[0].t < cutoff) n.samples.shift();
        if (n.samples.length > 40) n.samples.shift();
    }

    function computeSpeed(n){
        if (!n.samples || n.samples.length < 2) return 0;
        const first = n.samples[0];
        const last = n.samples[n.samples.length - 1];
        const dt = (last.t - first.t) / 1000;
        if (dt <= 0.5) return 0;
        const dB = last.bytes - first.bytes;
        if (dB <= 0) return 0;
        return dB / dt;
    }

    /* ============================================================
       Render
       ============================================================ */
    const nodes = new Map();

    function render(){
        if (!items.length){
            listEl.innerHTML = `<div class="empty">${ICON.inbox}<span>${t('empty')}</span></div>`;
            nodes.clear();
            return;
        }
        listEl.querySelector('.empty')?.remove();
        const seen = new Set();
        let i = 0;
        for (const it of items){
            seen.add(it.id);
            let n = nodes.get(it.id);
            if (!n){ n = mount(it, i); nodes.set(it.id, n); }
            update(n, it);
            i++;
        }
        for (const [id, n] of nodes) if (!seen.has(id)){ n.el.remove(); nodes.delete(id); }
        items.forEach(it => listEl.appendChild(nodes.get(it.id).el));
    }

    function mount(it, index){
        const el = document.createElement('article');
        el.className = 'card';
        el.dataset.id = it.id;
        el.style.setProperty('--i', index);
        el.innerHTML = `
    <div class="card-top">
      <div class="meta">
        <span class="file-icon">${fileIcon(it.name, it.url)}</span>
        <div style="min-width:0;flex:1">
          <div class="name"></div>
          <div class="sub">
            <span class="sub-text"></span>
            <span class="note" hidden></span>
          </div>
        </div>
      </div>
      <span class="badge"></span>
    </div>
    <div class="bar"><i></i></div>
    <div class="stats"></div>
    <div class="card-error" hidden></div>
    <div class="actions"></div>
    <video class="player" controls preload="metadata" playsinline hidden></video>`;
        const n = {
            el,
            name: el.querySelector('.name'),
            subText: el.querySelector('.sub-text'),
            note: el.querySelector('.note'),
            badge: el.querySelector('.badge'),
            fill: el.querySelector('.bar i'),
            stats: el.querySelector('.stats'),
            errorEl: el.querySelector('.card-error'),
            actions: el.querySelector('.actions'),
            video: el.querySelector('.player'),
            lastStatus: it.status,
            videoLoaded: false,
            actionsSig: null,
            statsSig: null,
            samples: []
        };
        return n;
    }

    function update(n, it){
        const done = isDone(it.status), fail = isFail(it.status);
        const wasActive = !isDone(n.lastStatus) && !isFail(n.lastStatus);
        const busy = !done && !fail;

        if (wasActive && done){
            if (!it.finishedAt) it.finishedAt = Date.now();
            /* add just-done only once */
            if (!n.el.classList.contains('just-done')){
                n.el.classList.add('just-done');
                setTimeout(() => n.el.classList.remove('just-done'), 1200);
            }
            toast(t('ready') + ' · ' + (it.name || ''), 'ok');
            n.samples = [];
        }
        if (!it.finishedAt && (done || fail)) it.finishedAt = Date.now();
        n.lastStatus = it.status;

        /* ---- values ---- */
        const sizeRaw = Number(it.size);
        const sizeKnown = isFinite(sizeRaw) && sizeRaw > 0;
        const downloaded = Math.max(0, Number(it.downloaded) || 0);
        const pct = sizeKnown && downloaded > 0
            ? Math.min(100, Math.floor(downloaded / sizeRaw * 100)) : 0;

        if (busy && downloaded > 0) pushSample(n, downloaded);

        /* ---- name ---- */
        setText(n.name, it.name || 'file');
        setAttr(n.name, 'title', it.url || it.id);

        /* ---- sub line: id · bytes · pct ---- */
        const parts = [it.id];
        if (sizeKnown){
            parts.push(busy
                ? `${fmtBytes(downloaded) || '0 B'} / ${fmtBytes(sizeRaw)}`
                : fmtBytes(sizeRaw));
        } else if (downloaded > 0){
            parts.push(fmtBytes(downloaded));
        }
        if (busy && sizeKnown && downloaded > 0) parts.push(pct + '%');
        setText(n.subText, parts.filter(Boolean).join('  ·  '));

        /* ---- note (unknown size) ---- */
        if (busy && !sizeKnown && downloaded > 0){
            setHidden(n.note, false);
            setClass(n.note, 'note warn');
            setText(n.note, t('stillDownloading'));
        } else if (busy && !sizeKnown){
            setHidden(n.note, false);
            setClass(n.note, 'note muted');
            setText(n.note, t('sizeUnknown'));
        } else {
            setHidden(n.note, true);
            if (n.note.textContent) setText(n.note, '');
        }

        /* ---- stats row: speed · eta · elapsed ----
           Rebuilt only when the number of stats changes; otherwise
           we just update the .val spans by index.                    */
        updateStats(n, it, { busy, done, fail, sizeKnown, sizeRaw, downloaded });

        /* ---- card error ---- */
        const hasError = !!(it.error && busy);
        setHidden(n.errorEl, !hasError);
        if (hasError){
            const sig = it.error;
            if (n.errorEl.dataset.sig !== sig){
                n.errorEl.dataset.sig = sig;
                n.errorEl.innerHTML = ICON.alert;
                const span = document.createElement('span');
                span.textContent = sig;
                n.errorEl.appendChild(span);
            }
        } else if (n.errorEl.dataset.sig){
            n.errorEl.dataset.sig = '';
            n.errorEl.textContent = '';
        }

        /* ---- badge ---- */
        const badgeClass = 'badge ' + (done ? 'ok' : fail ? 'err' : 'busy');
        const badgeHtml = (done ? ICON.check : fail ? ICON.alert : '') +
            '<span>' + label(it.status) + '</span>';
        if (n.badge.dataset.sig !== badgeHtml){
            n.badge.dataset.sig = badgeHtml;
            n.badge.innerHTML = badgeHtml;
        }
        setClass(n.badge, badgeClass);

        /* ---- progress bar ----
           known size  → real 0→100% width
           unknown     → indeterminate sweep (CSS class)
           done        → 100%
           The width string is only written if it changed, so the
           transition doesn't re-fire on every 2.5s poll.               */
        const unknownSize = busy && !sizeKnown;
        if (n.el.classList.contains('is-unknown-size') !== unknownSize){
            n.el.classList.toggle('is-unknown-size', unknownSize);
        }
        let width = '';
        if (done) width = '100%';
        else if (sizeKnown) width = (downloaded > 0 ? pct : 0) + '%';
        setWidth(n.fill, width);

        /* ---- action buttons ---- */
        const sig = lang;
        if (n.actionsSig !== sig){
            n.actionsSig = sig;
            n.actions.innerHTML =
                `<button class="btn" data-act="play" type="button">${ICON.play}<span>${t('play')}</span></button>` +
                `<a class="btn is-disabled" data-act="save" href="#">${ICON.save}<span>${t('save')}</span></a>` +
                `<button class="btn ghost" data-act="copy" type="button">${ICON.copy}<span>${t('copy')}</span></button>` +
                `<button class="btn ghost" data-act="del" type="button">${ICON.trash}<span>${t('remove')}</span></button>`;
            n.playBtn = n.actions.querySelector('[data-act="play"]');
            n.saveBtn = n.actions.querySelector('[data-act="save"]');
        }
        if (n.playBtn){
            if (n.playBtn.disabled !== !done) n.playBtn.disabled = !done;
            setAttr(n.playBtn, 'title', !done ? t('working') : '');
        }
        if (n.saveBtn){
            const wantDisabled = !done;
            if (n.saveBtn.classList.contains('is-disabled') !== wantDisabled){
                n.saveBtn.classList.toggle('is-disabled', wantDisabled);
            }
            setAttr(n.saveBtn, 'aria-disabled', String(wantDisabled));
            const href = done ? `/downloads/${encodeURIComponent(it.id)}` : '#';
            if (n.saveBtn.getAttribute('href') !== href) n.saveBtn.setAttribute('href', href);
            setAttr(n.saveBtn, 'title', !done ? t('working') : '');
        }

        /* ---- deferred video src ---- */
        if (done && !n.videoLoaded){
            n.video.src = '/stream/' + encodeURIComponent(it.id);
            n.videoLoaded = true;
        }
    }

    /* --------- stats row (speed / eta / elapsed) --------- */
    function updateStats(n, it, { busy, done, fail, sizeKnown, sizeRaw, downloaded }){
        const stats = [];

        if (busy){
            /* speed */
            const speed = computeSpeed(n);
            if (speed > 0) stats.push({ key:'speed', icon:ICON.down, text: fmtSpeed(speed) });

            /* eta */
            if (sizeKnown && speed > 0){
                const etaSec = (sizeRaw - downloaded) / speed;
                if (etaSec > 0 && etaSec < 86400 * 3){
                    stats.push({ key:'eta', icon:ICON.hour, text: '~' + fmtDuration(etaSec) + ' ' + t('etaLeft') });
                }
            } else if (sizeKnown && downloaded > 0 && !speed){
                stats.push({ key:'eta', icon:ICON.hour, text: t('etaCalc'), muted: true });
            }

            /* elapsed (updated in-place by the ticker) */
            stats.push({ key:'elapsed', icon:ICON.clock, text: fmtElapsed(Date.now() - (it.startedAt || Date.now())) + ' ' + t('elapsed'), live:true });
        } else if (done || fail){
            /* show final elapsed for completed/failed items */
            if (it.startedAt && it.finishedAt){
                stats.push({ key:'elapsed', icon:ICON.clock, text: fmtElapsed(it.finishedAt - it.startedAt) + ' ' + t('elapsed'), live:false });
            }
            if (fail && it.error) stats.push({ key:'error', text: it.error, muted:true });
        }

        const sig = stats.map(s => s.key + '|' + (s.muted?'m':'') + '|' + (s.live?'l':'')).join(',');
        if (n.statsSig !== sig){
            n.statsSig = sig;
            n.stats.innerHTML = '';
            n.statsEls = {};
            stats.forEach((s, i) => {
                if (i > 0){
                    const sep = document.createElement('span');
                    sep.className = 'sep';
                    sep.textContent = '·';
                    n.stats.appendChild(sep);
                }
                const span = document.createElement('span');
                span.className = 'stat' + (s.muted ? ' muted' : '');
                if (s.icon) span.innerHTML = s.icon;
                const val = document.createElement('span');
                val.className = 'val';
                val.textContent = s.text;
                span.appendChild(val);
                n.stats.appendChild(span);
                n.statsEls[s.key] = val;
            });
        } else {
            /* update only text values, never touching structure */
            for (const s of stats){
                const el = n.statsEls?.[s.key];
                if (el && el.textContent !== s.text) el.textContent = s.text;
            }
        }
    }

    /* ============================================================
       Per-second elapsed ticker
       Only updates the elapsed .val text — no full re-render.
       ============================================================ */
    setInterval(() => {
        const now = Date.now();
        for (const it of items){
            if (isDone(it.status) || isFail(it.status)) continue;
            const n = nodes.get(it.id);
            if (!n || !n.statsEls?.elapsed) continue;
            const txt = fmtElapsed(now - (it.startedAt || now)) + ' ' + t('elapsed');
            const el = n.statsEls.elapsed;
            if (el.textContent !== txt) el.textContent = txt;
        }
    }, 1000);

    /* ============================================================
       Actions
       ============================================================ */
    listEl.addEventListener('click', async e => {
        const saveEl = e.target.closest('[data-act="save"]');
        if (saveEl && saveEl.classList.contains('is-disabled')){ e.preventDefault(); return; }

        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const card = btn.closest('.card');
        if (!card) return;
        const id = card.dataset.id;
        const act = btn.dataset.act;
        if (act === 'save') return;

        if (act === 'play'){
            if (btn.disabled) return;
            const v = card.querySelector('video');
            v.hidden = !v.hidden;
            if (!v.hidden) v.play().catch(() => {});
        } else if (act === 'copy'){
            try {
                await navigator.clipboard.writeText(`${location.origin}/downloads/${id}`);
                const span = btn.querySelector('span');
                const old = span.textContent;
                span.textContent = t('copied');
                toast(t('copied'), 'ok');
                setTimeout(() => span.textContent = old, 1200);
            } catch {
                toast(t('errCopy'), 'err');
            }
        } else if (act === 'del'){
            items = items.filter(x => x.id !== id);
            save(); render();
            toast(t('toastRemoved'));
        }
    });

    /* ============================================================
       Start download — verbose error reporting
       ============================================================ */
    function shakeInput(){
        urlEl.classList.remove('error');
        void urlEl.offsetWidth;
        urlEl.classList.add('error');
        setTimeout(() => urlEl.classList.remove('error'), 700);
    }

    function failStart(msg, { shake = false } = {}){
        hintEl.innerHTML = ICON.alert;
        const span = document.createElement('span');
        span.textContent = msg;
        hintEl.appendChild(span);
        toast(msg, 'err', 4200);
        if (shake) shakeInput();
    }

    function resetStartBtn(oldLabel){
        goEl.disabled = false;
        goEl.classList.remove('loading');
        const span = goEl.querySelector('span');
        if (span) span.textContent = oldLabel; else goEl.textContent = oldLabel;
    }

    async function start(){
        const url = urlEl.value.trim();
        if (!url){ failStart(t('errNoUrl'), { shake: true }); urlEl.focus(); return; }
        if (!/^https?:\/\//i.test(url)){ failStart(t('errInvalidUrl'), { shake: true }); urlEl.focus(); return; }

        goEl.disabled = true;
        goEl.classList.add('loading');
        const span = goEl.querySelector('span');
        const oldLabel = span ? span.textContent : goEl.textContent;
        if (span) span.textContent = t('starting'); else goEl.textContent = t('starting');
        hintEl.textContent = '';

        let res;
        try {
            res = await fetchWithTimeout('/dl/' + encodeURIComponent(url), 20000);
        } catch (err){
            const msg = err?.name === 'AbortError'
                ? t('errTimeout')
                : t('errNetwork') + (err?.message ? ' (' + err.message + ')' : '');
            failStart(msg); resetStartBtn(oldLabel); return;
        }

        if (!res.ok){
            failStart(`${t('errHttp')}: HTTP ${res.status} ${res.statusText || ''}`.trim());
            resetStartBtn(oldLabel); return;
        }

        let text;
        try { text = await res.text(); }
        catch (err){ failStart(`${t('errEmpty')} (${err?.message || 'read failed'})`); resetStartBtn(oldLabel); return; }

        if (!text || !text.trim()){ failStart(t('errEmpty')); resetStartBtn(oldLabel); return; }

        let parsed;
        try { parsed = JSON.parse(text); }
        catch { failStart(`${t('errBadJson')} — ${text.slice(0, 100)}`); resetStartBtn(oldLabel); return; }

        if (parsed && typeof parsed === 'object' && 'status' in parsed && parsed.status === false){
            const extra = parsed.msg ? ': ' + parsed.msg : '';
            failStart(t('errRejected') + extra); resetStartBtn(oldLabel); return;
        }

        const d = parsed?.data ?? parsed;
        if (!d || typeof d !== 'object'){ failStart(t('errNoData')); resetStartBtn(oldLabel); return; }
        if (!d.file_id){ failStart(t('errNoId')); resetStartBtn(oldLabel); return; }

        items.unshift(fromApi(d, url));
        save(); render();
        urlEl.value = '';
        toast(t('toastStarted'), 'ok');
        resetStartBtn(oldLabel);
    }

    goEl.addEventListener('click', start);
    urlEl.addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
    urlEl.addEventListener('input', () => { hintEl.textContent = ''; });

    $('#clear').addEventListener('click', () => {
        fetch('/clear').catch(() => {});
        items = []; save(); render();
        toast(t('toastCleared'));
    });

    /* ============================================================
       Polling — every 2.5 s, single-flight, verbose errors
       ============================================================ */
    let pollRunning = false;

    async function poll(){
        if (pollRunning) return;
        const active = items.filter(i => !isDone(i.status) && !isFail(i.status));
        if (!active.length) return;
        pollRunning = true;
        let changed = false;

        try {
            await Promise.all(active.map(async it => {
                try {
                    const res = await fetchWithTimeout('/status/' + encodeURIComponent(it.id), 10000);
                    if (!res.ok){
                        const msg = `${t('errHttp')}: HTTP ${res.status}`;
                        if (it.error !== msg){ it.error = msg; changed = true; }
                        return;
                    }
                    let text;
                    try { text = await res.text(); }
                    catch { if (it.error !== t('errEmpty')){ it.error = t('errEmpty'); changed = true; } return; }
                    if (!text || !text.trim()){
                        if (it.error !== t('errEmpty')){ it.error = t('errEmpty'); changed = true; }
                        return;
                    }
                    let parsed;
                    try { parsed = JSON.parse(text); }
                    catch {
                        if (it.error !== t('errBadJson')){ it.error = t('errBadJson'); changed = true; }
                        return;
                    }
                    if (parsed && typeof parsed === 'object' && parsed.status === false){
                        const msg = t('errRejected') + (parsed.msg ? ': ' + parsed.msg : '');
                        if (it.error !== msg){ it.error = msg; changed = true; }
                        return;
                    }
                    const d = parsed?.data ?? parsed;
                    if (!d || typeof d !== 'object'){
                        if (it.error !== t('errNoData')){ it.error = t('errNoData'); changed = true; }
                        return;
                    }
                    if (it.error){ it.error = null; changed = true; }

                    const before = it.status + ':' + it.downloaded + ':' + it.size;
                    mergeApi(it, d);
                    if ((it.status + ':' + it.downloaded + ':' + it.size) !== before) changed = true;

                } catch (err){
                    const msg = err?.name === 'AbortError' ? t('errTimeout') : t('errPollLost');
                    if (it.error !== msg){ it.error = msg; changed = true; }
                }
            }));
        } finally {
            pollRunning = false;
        }
        if (changed){ save(); render(); }
    }
    setInterval(poll, 2500);

    /* ============================================================
       Theme picker
       ============================================================ */
    function currentTheme(){ return document.documentElement.dataset.theme || 'nord'; }

    function buildThemeMenu(){
        themeMenu.innerHTML = '';
        THEMES.forEach(th => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.setAttribute('role', 'menuitemradio');
            btn.dataset.themeVal = th.id;
            btn.setAttribute('aria-selected', String(th.id === currentTheme()));
            btn.innerHTML = `
      <span class="swatch" aria-hidden="true">
        <i style="background:${th.bg}"></i>
        <i style="background:${th.ink}"></i>
        <i style="background:${th.accent}"></i>
      </span>
      <span>${th.name}</span>`;
            btn.addEventListener('click', () => { setTheme(th.id); closeThemeMenu(); });
            themeMenu.appendChild(btn);
        });
    }
    function setTheme(id){
        document.documentElement.dataset.theme = id;
        try { localStorage.setItem('dl.theme', id); } catch {}
        themeMenu.querySelectorAll('button').forEach(b =>
            b.setAttribute('aria-selected', String(b.dataset.themeVal === id)));
    }
    function openThemeMenu(){ themeMenu.hidden = false; themeBtn.setAttribute('aria-expanded','true'); }
    function closeThemeMenu(){ themeMenu.hidden = true; themeBtn.setAttribute('aria-expanded','false'); }
    themeBtn.addEventListener('click', e => {
        e.stopPropagation();
        themeMenu.hidden ? openThemeMenu() : closeThemeMenu();
    });
    document.addEventListener('click', e => {
        if (!themeMenu.hidden && !e.target.closest('.theme-wrap')) closeThemeMenu();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeThemeMenu(); });

    /* ============================================================
       Language
       ============================================================ */
    const langBtn = $('#lang');

    function applyLang(){
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
        langBtn.textContent = lang === 'fa' ? 'EN' : 'FA';

        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.textContent = t(el.dataset.i18n);
        });
        document.querySelectorAll('[data-i18n-ph]').forEach(el => {
            el.setAttribute('placeholder', t(el.dataset.i18nPh));
        });

        const tg = document.querySelector('.tg-btn');
        if (tg) tg.setAttribute('data-tip', t('contact'));

        /* force action & stats rebuild on lang change */
        nodes.forEach(n => { n.actionsSig = null; n.statsSig = null; n.badge.dataset.sig = ''; });
        render();
    }

    langBtn.addEventListener('click', () => {
        lang = lang === 'fa' ? 'en' : 'fa';
        try { localStorage.setItem('dl.lang', lang); } catch {}
        applyLang();
    });

    /* ============================================================
       Boot
       ============================================================ */
    buildThemeMenu();
    applyLang();
    render();
</script>
</body>
</html>
