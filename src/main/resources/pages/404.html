  <script>
    /* Read the theme / font / lang the user picked on the main app.
       Nothing on this page changes them — they are read-only here. */
    (function(){
      try {
        var t = localStorage.getItem('dl.theme');
        var f = localStorage.getItem('dl.font');
        var l = localStorage.getItem('dl.lang');
        if (t) document.documentElement.dataset.theme = t;
        if (f) document.documentElement.dataset.font = f;
        if (l) {
          document.documentElement.lang = l;
          document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
        }
      } catch(e){}
    })();
  </script>

    /* ============================================================
       BASE
       ============================================================ */
    *{ box-sizing:border-box; }
    html,body{ min-height:100%; }
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font:15px/1.6 var(--font-body); font-weight:400;
      -webkit-font-smoothing:antialiased;
      transition:background-color .35s ease, color .35s ease;
      position:relative;
      overflow-x:hidden;
      min-height:100vh;
      display:flex; flex-direction:column;
    }
    html[lang="fa"] body{ font-family:'Vazirmatn',var(--font-body); line-height:1.8; }

    body::before, body::after{
      content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    }
    html[data-theme="nord"] body::before{
      background:
              radial-gradient(900px 700px at 12% -5%,  rgba(136,192,208,0.075), transparent 62%),
              radial-gradient(700px 600px at 92% 15%,  rgba(143,188,187,0.055), transparent 62%),
              radial-gradient(800px 700px at 50% 110%, rgba(180,142,173,0.055), transparent 62%);
    }
    html[data-theme="nord"] body::after{
      background-image: radial-gradient(rgba(216,222,233,0.045) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 85%);
    }
    html[data-theme="liquid"] body::before{
      background:
              radial-gradient(800px 700px at 20% 0%,  rgba(127,199,217,0.09), transparent 60%),
              radial-gradient(700px 600px at 85% 30%, rgba(127,199,217,0.06), transparent 60%),
              radial-gradient(900px 800px at 50% 120%, rgba(120,180,200,0.06), transparent 60%);
    }
    html[data-theme="liquid"] body::after{
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 85%);
    }
    html[data-theme="rosepine"] body::before{
      background:
              radial-gradient(900px 700px at 15% -8%,  rgba(196,167,231,0.09), transparent 62%),
              radial-gradient(700px 600px at 88% 22%,  rgba(235,188,186,0.06), transparent 62%),
              radial-gradient(800px 700px at 50% 115%, rgba(156,207,216,0.06), transparent 62%);
    }
    html[data-theme="tokyo"] body::before{
      background:
              radial-gradient(900px 700px at 15% -8%,  rgba(122,162,247,0.10), transparent 62%),
              radial-gradient(700px 600px at 88% 22%,  rgba(187,154,247,0.08), transparent 62%),
              radial-gradient(800px 700px at 50% 115%, rgba(125,207,255,0.06), transparent 62%);
    }
    html[data-theme="gruvbox"] body::before{
      background:
              radial-gradient(900px 700px at 12% -5%,  rgba(250,189,47,0.06), transparent 62%),
              radial-gradient(700px 600px at 92% 20%,  rgba(254,128,25,0.05), transparent 62%),
              radial-gradient(800px 700px at 50% 110%, rgba(184,187,38,0.04), transparent 62%);
    }
    html[data-theme="paper"] body::before,
    html[data-theme="ink"] body::before{
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity:.05; mix-blend-mode:multiply;
    }
    html[data-theme="ink"] body::before{ opacity:.09; mix-blend-mode:overlay; }
    html[data-theme="solarized"] body::before{
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity:.035;
    }
    html[data-theme="dracula"] body::after,
    html[data-theme="catppuccin"] body::after,
    html[data-theme="gruvbox"] body::after{
      background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      mask-image: radial-gradient(ellipse at 50% 20%, #000 10%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 20%, #000 10%, transparent 80%);
    }
    html[data-theme="terminal"] body::before{
      background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(142,255,176,.028) 3px 4px);
    }
    html[data-theme="brutalist"] body::before{
      background-image: radial-gradient(#000 1px, transparent 1px);
      background-size: 20px 20px; opacity:.06;
    }

    /* ============================================================
       MAIN
       ============================================================ */
    .page{
      position:relative; z-index:1;
      flex: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 60px 24px 80px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center;
      width: 100%;
      animation: pageIn .55s cubic-bezier(.2,.8,.3,1) both;
    }
    @keyframes pageIn{ from{ opacity:0; transform:translateY(10px); } }

    /* ============================================================
       BIG 404 ART
       ============================================================ */
    .art{
      position: relative;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 16 / 8;
      margin-bottom: 36px;
      display: grid;
      place-items: center;
      user-select: none;
    }
    .art::before{
      content:"";
      position:absolute; inset: -10% -4%;
      background-image:
              linear-gradient(to right, var(--rule) 1px, transparent 1px),
              linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse at 50% 50%, #000 25%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 25%, transparent 70%);
      opacity: .8;
      pointer-events:none;
    }
    .art::after{
      content:"";
      position:absolute; inset: 10% 15%;
      background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 65%);
      filter: blur(30px);
      opacity: .7;
      pointer-events: none;
      animation: artPulse 6s ease-in-out infinite alternate;
    }
    @keyframes artPulse{
      from { transform: scale(.92); opacity: .5; }
      to   { transform: scale(1.06); opacity: .85; }
    }

    .digits{
      position: relative;
      display: flex; align-items: center; justify-content: center;
      gap: clamp(6px, 1.8vw, 16px);
      font-family: var(--font-head);
      font-weight: 800;
      font-size: clamp(72px, 16vw, 140px);
      line-height: .9;
      letter-spacing: -.045em;
      z-index: 1;
    }
    .digit{
      position: relative;
      color: var(--ink);
      text-shadow: 0 2px 0 color-mix(in srgb, var(--ink) 4%, transparent);
      animation: digitFloat 4s ease-in-out infinite;
    }
    .digit:nth-child(1){ animation-delay: 0s; }
    .digit:nth-child(3){ animation-delay: .7s; }
    @keyframes digitFloat{
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    .digits::before{
      content: attr(data-text);
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
      filter: blur(28px);
      opacity: .35;
      z-index: -1;
      letter-spacing: -.045em;
      font-family: inherit;
      font-weight: inherit;
      font-size: inherit;
    }
    .lens{
      position: relative;
      width: clamp(72px, 16vw, 140px);
      aspect-ratio: 1;
      display: grid; place-items: center;
      animation: digitFloat 4s ease-in-out infinite .35s;
    }
    .lens svg{
      width: 100%; height: 100%;
      color: var(--accent);
      filter: drop-shadow(0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent));
    }
    .lens .lens-ripple{
      position: absolute; inset: 8%;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      animation: lensRipple 2.6s ease-out infinite;
      pointer-events:none;
    }
    @keyframes lensRipple{
      0%   { transform: scale(.85); opacity: .55; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    .qmark{
      position: absolute;
      font-family: var(--font-head);
      font-weight: 800;
      color: var(--accent);
      opacity: .18;
      pointer-events: none;
      user-select: none;
    }
    .qmark.a{ top: 6%;  left: 8%;  font-size: 42px; animation: floatA 7s ease-in-out infinite; }
    .qmark.b{ top: 14%; right: 10%; font-size: 28px; animation: floatB 8s ease-in-out infinite; }
    .qmark.c{ bottom: 8%; left: 16%; font-size: 24px; animation: floatA 9s ease-in-out infinite .6s; }
    .qmark.d{ bottom: 12%; right: 14%; font-size: 34px; animation: floatB 7.5s ease-in-out infinite .3s; }
    @keyframes floatA{
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-14px) rotate(8deg); }
    }
    @keyframes floatB{
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-10px) rotate(-10deg); }
    }

    /* ============================================================
       TEXT
       ============================================================ */
    h1{
      font-family: var(--font-head);
      font-size: clamp(22px, 4vw, 30px);
      font-weight: var(--head-weight);
      letter-spacing: var(--head-tracking);
      line-height: 1.2;
      margin: 0 0 12px;
      color: var(--ink);
    }
    .lede{
      font-size: 14.5px;
      color: var(--muted);
      max-width: 460px;
      margin: 0 auto 28px;
      line-height: 1.65;
    }
    html[lang="fa"] .lede{ font-size: 14px; }

    .path{
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--ink-soft);
      background: var(--surface);
      border: var(--border-w) solid var(--rule);
      padding: 7px 12px 7px 11px;
      border-radius: var(--btn-radius);
      margin-bottom: 32px;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .path svg{ width: 13px; height: 13px; color: var(--muted); flex: 0 0 auto; }
    .path .path-text{
      overflow: hidden; text-overflow: ellipsis;
      max-width: 460px;
    }
    html[data-theme="liquid"] .path{
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* ============================================================
       ACTIONS
       ============================================================ */
    .actions{
      display: flex; align-items: center; justify-content: center;
      gap: 10px; flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .btn{
      font: inherit; font-size: 13.5px; cursor: pointer;
      border-radius: var(--btn-radius);
      padding: 12px 20px;
      border: var(--border-w) solid transparent;
      transition: background .16s, border-color .16s, color .16s,
      transform .1s, box-shadow .2s, filter .16s, opacity .16s;
      white-space: nowrap; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn svg{ width: 15px; height: 15px; display: block; flex: 0 0 auto; }

    .primary{
      background: var(--accent); color: var(--accent-fg);
      border-color: var(--accent); font-weight: 600; letter-spacing: .005em;
    }
    .primary:hover{ filter: brightness(1.06); transform: translateY(-1px); }
    .primary:active{ transform: translateY(0) scale(.99); }
    html[data-theme="brutalist"] .primary{
      border-color: var(--rule); box-shadow: 4px 4px 0 0 var(--rule);
    }
    html[data-theme="brutalist"] .primary:hover{
      filter: none; transform: translate(-1px,-1px);
      box-shadow: 5px 5px 0 0 var(--rule);
    }
    html[data-theme="brutalist"] .primary:active{
      transform: translate(3px,3px); box-shadow: 1px 1px 0 0 var(--rule);
    }

    .ghost{
      background: transparent;
      border-color: var(--rule);
      color: var(--ink);
    }
    .ghost:hover{ border-color: var(--rule-strong); background: var(--surface-2); transform: translateY(-1px); }
    .ghost:active{ transform: translateY(1px); }
    html[data-theme="liquid"] .ghost{
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-color: rgba(255,255,255,0.10);
    }
    html[data-theme="liquid"] .ghost:hover{
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.18);
    }
    html[data-theme="brutalist"] .ghost{ box-shadow: 3px 3px 0 0 var(--rule); }
    html[data-theme="brutalist"] .ghost:hover{
      transform: translate(-1px,-1px); box-shadow: 4px 4px 0 0 var(--rule);
    }
    html[data-theme="brutalist"] .ghost:active{
      transform: translate(2px,2px); box-shadow: 1px 1px 0 0 var(--rule);
    }

    /* ============================================================
       CONTACT US
       ============================================================ */
    .contact{
      margin-top: 28px;
      padding-top: 24px;
      border-top: var(--border-w) dashed var(--rule);
      display: flex; flex-direction: column;
      align-items: center; gap: 12px;
      width: 100%; max-width: 420px;
    }
    .contact-title{
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      display: inline-flex; align-items: center; gap: 8px;
    }
    html[lang="fa"] .contact-title{ text-transform: none; letter-spacing: 0; font-size: 12px; }
    .contact-title::before,
    .contact-title::after{
      content: ""; width: 20px; height: 1px;
      background: var(--rule-strong);
    }
    .contact-btn{
      display: inline-flex; align-items: center; gap: 10px;
      padding: 11px 18px 11px 14px;
      border-radius: 999px;
      background: #229ed9;
      color: #fff;
      font-size: 13.5px; font-weight: 600;
      text-decoration: none;
      border: 0;
      box-shadow: 0 10px 24px -12px rgba(34,158,217,.7);
      transition: transform .2s cubic-bezier(.2,.9,.3,1.3), box-shadow .25s, filter .2s;
    }
    .contact-btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 16px 32px -12px rgba(34,158,217,.9);
      filter: brightness(1.05);
    }
    .contact-btn:active{ transform: translateY(0) scale(.98); }
    .contact-btn svg{ width: 18px; height: 18px; display: block; flex: 0 0 auto; }
    .contact-btn .contact-sub{
      display: block;
      font-size: 11px;
      font-weight: 500;
      opacity: .85;
      letter-spacing: 0;
      text-transform: none;
      margin-top: -1px;
    }
    .contact-btn .contact-text{
      display: flex; flex-direction: column; align-items: flex-start;
      line-height: 1.15;
      text-align: start;
    }

    /* ============================================================
       FOOTER
       ============================================================ */
    .foot{
      position: relative; z-index: 1;
      text-align: center;
      padding: 20px 24px 32px;
      font-size: 11.5px;
      color: var(--muted);
      font-family: var(--font-mono);
      display: flex; align-items: center; justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    html[lang="fa"] .foot{ font-family: var(--font-body); }
    .foot .dot{ opacity: .5; }

    /* ============================================================
       RTL
       ============================================================ */
    html[dir="rtl"] .contact-btn{ padding: 11px 14px 11px 18px; }
    html[dir="rtl"] .contact-btn .contact-text{ align-items: flex-end; }

    /* ============================================================
       REDUCED MOTION
       ============================================================ */
    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 600px){
      .page{ padding: 40px 18px 60px; }
      .art{ margin-bottom: 26px; aspect-ratio: 16 / 10; }
      h1{ font-size: 22px; }
      .lede{ font-size: 14px; }
      .path .path-text{ max-width: 240px; }
      .actions .btn{ flex: 1 1 auto; }
      .foot{ padding-bottom: 24px; }
    }
  </style>
</head>
<body>

<main class="page">
  <div class="art" aria-hidden="true">
    <span class="qmark a">?</span>
    <span class="qmark b">?</span>
    <span class="qmark c">?</span>
    <span class="qmark d">?</span>

    <div class="digits" data-text="404">
      <span class="digit">4</span>
      <span class="lens">
        <span class="lens-ripple"></span>
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor"
             stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="43" cy="43" r="28"/>
          <path d="M64 64 L84 84"/>
        </svg>
      </span>
      <span class="digit">4</span>
    </div>
  </div>

  <h1 data-i18n="title">Page not found</h1>
  <p class="lede" data-i18n="lede">
    The page you're looking for doesn't exist, was moved, or was never here.
    Double-check the URL or head back to the home page.
  </p>

  <div class="path" id="pathBox" title="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/>
      <path d="m21 21-4.3-4.3"/>
    </svg>
    <span class="path-text" id="pathText">/</span>
  </div>

  <div class="actions">
    <a class="btn primary" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m3 10 9-7 9 7"/>
        <path d="M5 9v11a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9"/>
      </svg>
      <span data-i18n="goHome">Go home</span>
    </a>
    <button class="btn ghost" id="backBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"/>
        <path d="m12 19-7-7 7-7"/>
      </svg>
      <span data-i18n="goBack">Go back</span>
    </button>
  </div>

  <section class="contact">
    <div class="contact-title" data-i18n="contactTitle">Contact us</div>
    <a class="contact-btn" href="https://t.me/Andy_Br0wn" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
      </svg>
      <span class="contact-text">
        <span data-i18n="contactAction" >Message on Telegram</span>
<!--        <span class="contact-sub" style="text-align: center;width: 100%">@Andy_Br0wn</span>-->
      </span>
    </a>
  </section>
</main>

<footer class="foot">
  <span data-i18n="footLeft">Error 404</span>
  <span class="dot">·</span>
  <span id="footTime">—</span>
</footer>

<script>
  /* ============================================================
     i18n
     ============================================================ */
  const I18N = {
    en:{
      title:'Page not found',
      lede:"The page you're looking for doesn't exist, was moved, or was never here. Double-check the URL or head back to the home page.",
      goHome:'Go home', goBack:'Go back',
      contactTitle:'Contact us',
      contactAction:'Message on Telegram',
      footLeft:'Error 404'
    },
    fa:{
      title:'صفحه پیدا نشد',
      lede:'صفحه‌ای که به دنبال آن هستید وجود ندارد، جابه‌جا شده، یا هرگز اینجا نبوده است. نشانی را دوباره بررسی کنید یا به صفحهٔ اصلی بازگردید.',
      goHome:'بازگشت به خانه', goBack:'بازگشت',
      contactTitle:'تماس با ما',
      contactAction:'پیام در تلگرام',
      footLeft:'خطای ۴۰۴'
    }
  };

  /* lang is READ-ONLY here — it comes from localStorage. */
  const lang = document.documentElement.lang === 'fa' ? 'fa' : 'en';
  const t = k => (I18N[lang] && I18N[lang][k]) ?? I18N.en[k] ?? k;

  const $ = (s) => document.querySelector(s);

  /* ============================================================
     Path display
     ============================================================ */
  const pathBox = $('#pathBox');
  const pathText = $('#pathText');
  try {
    const raw = location.pathname + location.search + location.hash;
    pathText.textContent = raw && raw !== '/' ? raw : '/';
    pathBox.title = location.href;
  } catch { pathText.textContent = '/'; }

  /* ============================================================
     Footer timestamp
     ============================================================ */
  const footTime = $('#footTime');
  function tickFoot(){
    try {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      footTime.textContent = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    } catch { footTime.textContent = ''; }
  }
  tickFoot();
  setInterval(tickFoot, 30_000);

  /* ============================================================
     Back button
     ============================================================ */
  $('#backBtn').addEventListener('click', () => {
    if (history.length > 1) history.back();
    else location.href = '/';
  });

  /* ============================================================
     Apply translations (no pickers, no user input)
     ============================================================ */
  function applyLang(){
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });
    document.title = lang === 'fa' ? '۴۰۴ · پیدا نشد' : '404 · Not Found';
  }
  applyLang();
</script>
</body>
</html>
